<svg width="600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Form background -->
  <rect x="0" y="0" width="600" height="1200" rx="16" fill="#fff" stroke="#BDBDBD" />
  <text x="40" y="50" font-size="24" fill="#1976D2" font-family="Arial">Thêm/Sửa Gói thầu</text>
  <!-- Input fields -->
  <text x="40" y="100" font-size="16" fill="#212121" font-family="Arial">Tên gói thầu *</text>
  <rect x="40" y="110" width="520" height="60" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <!-- Scrollbar for Tên gói thầu -->
  <rect x="550" y="110" width="10" height="60" rx="4" fill="#E0E0E0" />
  <rect x="550" y="120" width="10" height="20" rx="4" fill="#BDBDBD" />
  <text x="40" y="190" font-size="16" fill="#212121" font-family="Arial">Nội dung công việc chính *</text>
  <rect x="40" y="200" width="520" height="60" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <!-- Scrollbar for Nội dung công việc chính -->
  <rect x="550" y="200" width="10" height="60" rx="4" fill="#E0E0E0" />
  <rect x="550" y="210" width="10" height="20" rx="4" fill="#BDBDBD" />
  <text x="40" y="280" font-size="16" fill="#212121" font-family="Arial">Lĩnh vực *</text>
  <!-- Dropdown for Lĩnh vực -->
  <rect x="40" y="290" width="520" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="540,310 550,310 545,320" fill="#1976D2" />
  <text x="60" y="315" font-size="15" fill="#757575" font-family="Arial">Chọn lĩnh vực</text>
  <text x="40" y="350" font-size="16" fill="#212121" font-family="Arial">Giá gói thầu *</text>
  <rect x="40" y="360" width="400" height="40" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <!-- Dropdown for currency (VND only, aligned with Lĩnh vực) -->
  <rect x="450" y="360" width="110" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="480" y="385" font-size="15" fill="#757575" font-family="Arial">VND</text>
  <polygon points="530,380 540,380 535,390" fill="#1976D2" />
  <text x="40" y="420" font-size="16" fill="#212121" font-family="Arial">Nguồn vốn *</text>
  <!-- Dropdown for Nguồn vốn -->
  <rect x="40" y="430" width="520" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="540,450 550,450 545,460" fill="#1976D2" />
  <text x="60" y="455" font-size="15" fill="#757575" font-family="Arial">Chọn nguồn vốn</text>
  <text x="40" y="490" font-size="16" fill="#212121" font-family="Arial">Hình thức LCNT *</text>
  <!-- Dropdown for Hình thức LCNT -->
  <rect x="40" y="500" width="240" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="250,520 260,520 255,530" fill="#1976D2" />
  <text x="60" y="525" font-size="15" fill="#757575" font-family="Arial">Chọn hình thức</text>
  <text x="320" y="490" font-size="16" fill="#212121" font-family="Arial">Phương thức LCNT *</text>
  <!-- Dropdown for Phương thức LCNT -->
  <rect x="320" y="500" width="240" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="530,520 540,520 535,530" fill="#1976D2" />
  <text x="340" y="525" font-size="15" fill="#757575" font-family="Arial">Chọn phương thức</text>
  <text x="40" y="570" font-size="16" fill="#212121" font-family="Arial">Thời gian TCLCNT *</text>
  <!-- Number input for Thời gian TCLCNT, đơn vị ngày -->
  <rect x="40" y="580" width="120" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="55" y="605" font-size="15" fill="#757575" font-family="Arial">0</text>
  <text x="170" y="605" font-size="15" fill="#212121" font-family="Arial">Ngày</text>
  <text x="320" y="570" font-size="16" fill="#212121" font-family="Arial">Thời gian bắt đầu TCLCNT *</text>
  <!-- Dropdown for Quý -->
  <rect x="320" y="580" width="80" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="340" y="605" font-size="15" fill="#757575" font-family="Arial">Quý</text>
  <polygon points="380,600 390,600 385,610" fill="#1976D2" />
  <!-- Dropdown for Năm -->
  <rect x="410" y="580" width="80" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="430" y="605" font-size="15" fill="#757575" font-family="Arial">Năm</text>
  <polygon points="470,600 480,600 475,610" fill="#1976D2" />
  <text x="40" y="650" font-size="16" fill="#212121" font-family="Arial">Loại hợp đồng *</text>
  <!-- Dropdown for Loại hợp đồng -->
  <rect x="40" y="660" width="240" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="230,680 240,680 235,690" fill="#1976D2" />
  <text x="60" y="685" font-size="15" fill="#757575" font-family="Arial">Chọn loại hợp đồng</text>
  <text x="320" y="650" font-size="16" fill="#212121" font-family="Arial">Thời gian thực hiện *</text>
  <!-- Number input for Thời gian thực hiện, đơn vị tháng -->
  <rect x="320" y="660" width="120" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="335" y="685" font-size="15" fill="#757575" font-family="Arial">0</text>
  <text x="450" y="685" font-size="15" fill="#212121" font-family="Arial">Tháng</text>
  <text x="40" y="730" font-size="16" fill="#212121" font-family="Arial">Trạng thái *</text>
  <!-- Dropdown for Trạng thái -->
  <rect x="40" y="740" width="520" height="40" rx="8" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <polygon points="540,760 550,760 545,770" fill="#1976D2" />
  <text x="60" y="765" font-size="15" fill="#757575" font-family="Arial">Chọn trạng thái</text>
  <!-- Upload file: 5 required files -->
  <text x="40" y="810" font-size="16" fill="#212121" font-family="Arial">Tài liệu đính kèm *</text>
  <g>
    <text x="60" y="850" font-size="15" fill="#1976D2" font-family="Arial">Báo cáo đề xuất chủ trương *</text>
    <rect x="400" y="835" width="160" height="32" rx="6" fill="#1976D2" />
    <text x="480" y="857" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Chọn file</text>
  </g>
  <g>
    <text x="60" y="900" font-size="15" fill="#1976D2" font-family="Arial">Báo giá 1 *</text>
    <rect x="400" y="885" width="160" height="32" rx="6" fill="#1976D2" />
    <text x="480" y="907" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Chọn file</text>
  </g>
  <g>
    <text x="60" y="950" font-size="15" fill="#1976D2" font-family="Arial">Báo giá 2 *</text>
    <rect x="400" y="935" width="160" height="32" rx="6" fill="#1976D2" />
    <text x="480" y="957" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Chọn file</text>
  </g>
  <g>
    <text x="60" y="1000" font-size="15" fill="#1976D2" font-family="Arial">Báo giá 3 *</text>
    <rect x="400" y="985" width="160" height="32" rx="6" fill="#1976D2" />
    <text x="480" y="1007" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Chọn file</text>
  </g>
  <g>
    <text x="60" y="1050" font-size="15" fill="#1976D2" font-family="Arial">Báo cáo thẩm định chủ trương *</text>
    <rect x="400" y="1035" width="160" height="32" rx="6" fill="#1976D2" />
    <text x="480" y="1057" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Chọn file</text>
  </g>
  <!-- Action buttons (move down) -->
  <rect x="340" y="1120" width="100" height="40" rx="8" fill="#1976D2" />
  <text x="370" y="1145" font-size="16" fill="#fff" font-family="Arial">Lưu</text>
  <rect x="460" y="1120" width="100" height="40" rx="8" fill="#BDBDBD" />
  <text x="490" y="1145" font-size="16" fill="#fff" font-family="Arial">Hủy</text>
</svg>
