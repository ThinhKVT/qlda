<svg width="700" height="540" xmlns="http://www.w3.org/2000/svg">
  <!-- Popup background -->
  <rect x="0" y="0" width="700" height="540" rx="16" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <!-- Title -->
  <text x="40" y="50" font-size="26" fill="#1976D2" font-family="Arial" font-weight="bold">Tìm kiếm nâng cao</text>
  <!-- Close button -->
  <rect x="650" y="20" width="30" height="30" rx="6" fill="#E0E0E0" />
  <text x="660" y="42" font-size="20" fill="#757575" font-family="Arial" font-weight="bold">×</text>
  <!-- Form fields -->
  <!-- Row 1 -->
  <text x="40" y="100" font-size="15" fill="#212121" font-family="Arial">Mã dự án</text>
  <rect x="150" y="80" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="160" y="102" font-size="15" fill="#757575" font-family="Arial">Nhập mã dự án</text>
  <text x="360" y="100" font-size="15" fill="#212121" font-family="Arial">Tên dự án</text>
  <rect x="470" y="80" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="480" y="102" font-size="15" fill="#757575" font-family="Arial">Nhập tên dự án</text>
  <!-- Row 2 -->
  <text x="40" y="150" font-size="15" fill="#212121" font-family="Arial">Loại dự án</text>
  <rect x="150" y="130" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="160" y="152" font-size="15" fill="#757575" font-family="Arial">Chọn loại dự án</text>
  <text x="360" y="150" font-size="15" fill="#212121" font-family="Arial">Phòng đầu mối</text>
  <rect x="470" y="130" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="480" y="152" font-size="15" fill="#757575" font-family="Arial">Chọn phòng đầu mối</text>
  <!-- Row 3 -->
  <text x="40" y="200" font-size="15" fill="#212121" font-family="Arial">Cán bộ đầu mối</text>
  <rect x="150" y="180" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="160" y="202" font-size="15" fill="#757575" font-family="Arial">Nhập cán bộ đầu mối</text>
  <text x="360" y="200" font-size="15" fill="#212121" font-family="Arial">Cán bộ QLDA</text>
  <rect x="470" y="180" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="480" y="202" font-size="15" fill="#757575" font-family="Arial">Nhập cán bộ QLDA</text>
  <!-- Row 4 -->
  <text x="40" y="250" font-size="15" fill="#212121" font-family="Arial">Năm kế hoạch</text>
  <rect x="150" y="230" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="160" y="252" font-size="15" fill="#757575" font-family="Arial">Nhập năm</text>
  <text x="360" y="250" font-size="15" fill="#212121" font-family="Arial">Trạng thái</text>
  <!-- Dropdown for Trạng thái (single-line, no tags) -->
  <g>
    <rect x="470" y="230" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <rect x="630" y="234" width="16" height="24" rx="4" fill="#E3F2FD" stroke="#1976D2" />
    <polygon points="638,246 642,246 640,250" fill="#1976D2" />
    <text x="480" y="252" font-size="15" fill="#757575" font-family="Arial">Chọn trạng thái...</text>
    <!-- Example selected values as tags -->
    <rect x="480" y="236" width="50" height="18" rx="4" fill="#1976D2" />
    <text x="485" y="250" font-size="12" fill="#fff" font-family="Arial">Đang thực hiện</text>
    <rect x="535" y="236" width="40" height="18" rx="4" fill="#43A047" />
    <text x="540" y="250" font-size="12" fill="#fff" font-family="Arial">Hoàn tất</text>
  </g>
  <!-- Row 5 -->
  <text x="40" y="300" font-size="15" fill="#212121" font-family="Arial">Ngày bắt đầu</text>
  <!-- Date picker for Ngày bắt đầu -->
  <g>
    <rect x="150" y="280" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <rect x="290" y="284" width="36" height="24" rx="4" fill="#E3F2FD" stroke="#1976D2" />
    <text x="298" y="302" font-size="16" fill="#1976D2" font-family="Arial">📅</text>
    <text x="160" y="302" font-size="15" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
  </g>
  <text x="360" y="300" font-size="15" fill="#212121" font-family="Arial">Ngày kết thúc</text>
  <!-- Date picker for Ngày kết thúc -->
  <g>
    <rect x="470" y="280" width="180" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <rect x="610" y="284" width="36" height="24" rx="4" fill="#E3F2FD" stroke="#1976D2" />
    <text x="618" y="302" font-size="16" fill="#1976D2" font-family="Arial">📅</text>
    <text x="480" y="302" font-size="15" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
  </g>
  <!-- Action buttons -->
  <rect x="370" y="400" width="120" height="40" rx="8" fill="#1976D2" />
  <text x="400" y="427" font-size="16" fill="#fff" font-family="Arial">Tìm kiếm</text>
  <rect x="510" y="400" width="120" height="40" rx="8" fill="#BDBDBD" />
  <text x="545" y="427" font-size="16" fill="#fff" font-family="Arial">Đặt lại</text>
</svg>
