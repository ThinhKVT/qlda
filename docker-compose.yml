version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: qlda-postgres
    environment:
      POSTGRES_DB: qlda
      POSTGRES_USER: qlda
      POSTGRES_PASSWORD: qlda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlda -d qlda"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
