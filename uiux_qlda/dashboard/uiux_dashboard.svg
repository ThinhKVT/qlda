<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (active) -->
  <rect x="0" y="100" width="220" height="50" fill="#1565C0" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <!-- Dự án -->
  <rect x="0" y="150" width="220" height="50" fill="#1976D2" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <!-- Hợp đồng -->
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <!-- Nhà thầu -->
  <rect x="0" y="250" width="220" height="50" fill="#1976D2" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <!-- Kho tri thức -->
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>

  <!-- Topbar -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <text x="250" y="40" font-size="24" fill="#fff" font-family="Arial">Dashboard tổng quan</text>
  <!-- Actions (optional) -->
  <g id="top-actions">
    <!-- Dropdown Năm kế hoạch -->
    <text x="1500" y="37" font-size="12" fill="#E3F2FD" font-family="Arial">Năm KH</text>
    <rect x="1570" y="18" width="180" height="28" rx="6" fill="#F5F5F5" stroke="#1976D2" />
    <text x="1655" y="37" font-size="12" fill="#212121" font-family="Arial" text-anchor="middle">2025</text>
    <polygon points="1730,30 1736,36 1724,36" fill="#1976D2" />
    <!-- Nút Refresh -->
    <rect x="1780" y="18" width="60" height="28" rx="6" fill="#E3F2FD" stroke="#1976D2" />
    <text x="1810" y="37" font-size="12" fill="#1976D2" font-family="Arial" text-anchor="middle">Refresh</text>
  </g>

  <!-- KPI Cards -->
  <g id="kpi-cards">
    <rect x="250" y="80" width="340" height="90" rx="12" fill="#E3F2FD" stroke="#1976D2" />
    <text x="270" y="105" font-size="12" fill="#1976D2" font-family="Arial">Tổng số Dự án</text>
    <text x="270" y="140" font-size="28" fill="#212121" font-family="Arial">128</text>

    <rect x="610" y="80" width="340" height="90" rx="12" fill="#E8F5E9" stroke="#43A047" />
    <text x="630" y="105" font-size="12" fill="#2E7D32" font-family="Arial">Tổng giá trị HĐ (VND)</text>
    <text x="630" y="140" font-size="24" fill="#212121" font-family="Arial">25.430.000.000.000</text>

    <rect x="970" y="80" width="340" height="90" rx="12" fill="#FFF8E1" stroke="#FBC02D" />
    <text x="990" y="105" font-size="12" fill="#F9A825" font-family="Arial">Tỷ lệ thanh toán TB</text>
    <text x="990" y="140" font-size="28" fill="#212121" font-family="Arial">68%</text>

    <rect x="1330" y="80" width="340" height="90" rx="12" fill="#FFEBEE" stroke="#D32F2F" />
    <text x="1350" y="105" font-size="12" fill="#D32F2F" font-family="Arial">Cần xử lý hôm nay</text>
    <text x="1350" y="140" font-size="28" fill="#212121" font-family="Arial">12</text>
  </g>

  <!-- Alert bar -->
  <g id="warning-bar">
    <rect x="250" y="180" width="1620" height="40" rx="8" fill="#FFF3E0" stroke="#FBC02D" />
    <text x="270" y="205" font-size="14" fill="#F57C00" font-family="Arial">HĐ sắp hết hạn (&lt; 30 ngày): 12</text>
    <text x="520" y="205" font-size="14" fill="#D32F2F" font-family="Arial">HĐ đã hết hạn chưa thanh lý: 5</text>
    <text x="820" y="205" font-size="12" fill="#757575" font-family="Arial">* Bấm vào số để lọc nhanh</text>
  </g>

  <!-- Charts row -->
  <g id="charts-row">
    <!-- Line chart: Giá trị ký theo quý -->
    <rect x="250" y="230" width="780" height="320" rx="12" fill="#fff" stroke="#BDBDBD" />
    <text x="270" y="255" font-size="16" fill="#1976D2" font-family="Arial">Giá trị ký theo quý (VND)</text>
    <!-- Axes -->
    <line x1="300" y1="510" x2="980" y2="510" stroke="#E0E0E0" />
    <line x1="300" y1="270" x2="300" y2="510" stroke="#E0E0E0" />
    <!-- Bars -->
    <rect x="340" y="420" width="30" height="90" fill="#64B5F6" />
    <rect x="420" y="380" width="30" height="130" fill="#64B5F6" />
    <rect x="500" y="350" width="30" height="160" fill="#1976D2" />
    <rect x="580" y="390" width="30" height="120" fill="#64B5F6" />
    <rect x="660" y="340" width="30" height="170" fill="#1976D2" />
    <rect x="740" y="360" width="30" height="150" fill="#64B5F6" />
    <rect x="820" y="320" width="30" height="190" fill="#1976D2" />
    <!-- X labels -->
    <text x="340" y="530" font-size="12" fill="#757575" font-family="Arial">Q1</text>
    <text x="420" y="530" font-size="12" fill="#757575" font-family="Arial">Q2</text>
    <text x="500" y="530" font-size="12" fill="#757575" font-family="Arial">Q3</text>
    <text x="580" y="530" font-size="12" fill="#757575" font-family="Arial">Q4</text>
    <text x="660" y="530" font-size="12" fill="#757575" font-family="Arial">Q5</text>
    <text x="740" y="530" font-size="12" fill="#757575" font-family="Arial">Q6</text>
    <text x="820" y="530" font-size="12" fill="#757575" font-family="Arial">Q7</text>
  </g>

  <g id="pie-card">
    <!-- Pie/doughnut: Phân bố trạng thái HĐ -->
    <rect x="1050" y="230" width="820" height="320" rx="12" fill="#fff" stroke="#BDBDBD" />
    <text x="1070" y="255" font-size="16" fill="#1976D2" font-family="Arial">Phân bố hợp đồng theo trạng thái</text>
    <!-- Doughnut: 4 phần bằng nhau, tròn và cân đối -->
    <!-- Xoá hình tròn nền và các segment cũ, thay bằng 4 wedge bằng nhau -->
    <!-- Segment 1: Hiệu lực (trên -> phải) -->
    <path d="M 1260 390 L 1260 300 A 90 90 0 0 1 1350 390 Z" fill="#43A047" />
    <!-- Segment 2: Sắp hết hạn (phải -> dưới) -->
    <path d="M 1260 390 L 1350 390 A 90 90 0 0 1 1260 480 Z" fill="#FBC02D" />
    <!-- Segment 3: Hết hạn (dưới -> trái) -->
    <path d="M 1260 390 L 1260 480 A 90 90 0 0 1 1170 390 Z" fill="#D32F2F" />
    <!-- Segment 4: Thanh lý (trái -> trên) -->
    <path d="M 1260 390 L 1170 390 A 90 90 0 0 1 1260 300 Z" fill="#757575" />
    <!-- Lỗ bên trong để tạo doughnut -->
    <circle cx="1260" cy="390" r="48" fill="#fff" />
    <text x="1260" y="394" font-size="18" fill="#212121" font-family="Arial" text-anchor="middle">100%</text>
    <!-- Legend giữ nguyên -->
    <rect x="1420" y="330" width="16" height="16" rx="4" fill="#43A047" />
    <text x="1444" y="343" font-size="13" fill="#212121" font-family="Arial">Hiệu lực</text>
    <rect x="1420" y="360" width="16" height="16" rx="4" fill="#FBC02D" />
    <text x="1444" y="373" font-size="13" fill="#212121" font-family="Arial">Sắp hết hạn</text>
    <rect x="1420" y="390" width="16" height="16" rx="4" fill="#D32F2F" />
    <text x="1444" y="403" font-size="13" fill="#212121" font-family="Arial">Hết hạn</text>
    <rect x="1420" y="420" width="16" height="16" rx="4" fill="#757575" />
    <text x="1444" y="433" font-size="13" fill="#212121" font-family="Arial">Thanh lý</text>
  </g>

  <!-- Lower row: Danh sách nhanh & Timeline -->
  <g id="lists-row">
    <!-- Gói thầu đang triển khai -->
    <rect x="250" y="570" width="780" height="420" rx="12" fill="#fff" stroke="#BDBDBD" />
    <text x="270" y="596" font-size="16" fill="#1976D2" font-family="Arial">Gói thầu đang triển khai</text>
    <rect x="250" y="610" width="780" height="36" fill="#E3F2FD" />
    <text x="270" y="634" font-size="13" fill="#1976D2" font-family="Arial">Mã gói</text>
    <text x="380" y="634" font-size="13" fill="#1976D2" font-family="Arial">Tên gói</text>
    <text x="760" y="634" font-size="13" fill="#1976D2" font-family="Arial">Trạng thái</text>
    <text x="930" y="634" font-size="13" fill="#1976D2" font-family="Arial">% Tiến độ</text>
    <!-- Row 1 -->
    <rect x="250" y="646" width="780" height="44" fill="#fff" stroke="#E0E0E0" />
    <text x="270" y="672" font-size="12" fill="#212121" font-family="Arial">GT01</text>
    <text x="380" y="672" font-size="12" fill="#212121" font-family="Arial">Triển khai phần mềm A</text>
    <rect x="740" y="658" width="100" height="20" rx="10" fill="#FBC02D" />
    <text x="790" y="672" font-size="12" fill="#212121" font-family="Arial" text-anchor="middle">Đang thực hiện</text>
    <rect x="900" y="665" width="80" height="8" rx="4" fill="#E0E0E0" />
    <rect x="900" y="665" width="48" height="8" rx="4" fill="#1976D2" />
    <text x="940" y="672" font-size="10" fill="#212121" font-family="Arial" text-anchor="middle">60%</text>
    <!-- Row 2 -->
    <rect x="250" y="690" width="780" height="44" fill="#FAFAFA" stroke="#E0E0E0" />
    <text x="270" y="716" font-size="12" fill="#212121" font-family="Arial">GT02</text>
    <text x="380" y="716" font-size="12" fill="#212121" font-family="Arial">Bảo trì hệ thống B</text>
    <rect x="740" y="702" width="100" height="20" rx="10" fill="#43A047" />
    <text x="790" y="716" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Đúng tiến độ</text>
    <rect x="900" y="709" width="80" height="8" rx="4" fill="#E0E0E0" />
    <rect x="900" y="709" width="64" height="8" rx="4" fill="#1976D2" />
    <text x="940" y="716" font-size="10" fill="#212121" font-family="Arial" text-anchor="middle">80%</text>
    <!-- Row 3 -->
    <rect x="250" y="734" width="780" height="44" fill="#fff" stroke="#E0E0E0" />
    <text x="270" y="760" font-size="12" fill="#212121" font-family="Arial">GT03</text>
    <text x="380" y="760" font-size="12" fill="#212121" font-family="Arial">Cung cấp thiết bị mạng</text>
    <rect x="740" y="746" width="100" height="20" rx="10" fill="#D32F2F" />
    <text x="790" y="760" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Chậm tiến độ</text>
    <rect x="900" y="753" width="80" height="8" rx="4" fill="#E0E0E0" />
    <rect x="900" y="753" width="24" height="8" rx="4" fill="#D32F2F" />
    <text x="940" y="760" font-size="10" fill="#212121" font-family="Arial" text-anchor="middle">30%</text>
  </g>

  <g id="timeline-card">
    <!-- Các dự án đang chậm tiến độ -->
    <rect x="1050" y="570" width="820" height="420" rx="12" fill="#fff" stroke="#BDBDBD" />
    <text x="1070" y="596" font-size="16" fill="#1976D2" font-family="Arial">Các dự án đang chậm tiến độ</text>
    <!-- Header bảng -->
    <rect x="1050" y="610" width="820" height="36" fill="#E3F2FD" />
    <text x="1070" y="634" font-size="13" fill="#1976D2" font-family="Arial">Mã DA</text>
    <text x="1150" y="634" font-size="13" fill="#1976D2" font-family="Arial">Tên dự án</text>
    <text x="1500" y="634" font-size="13" fill="#1976D2" font-family="Arial">% KH</text>
    <text x="1570" y="634" font-size="13" fill="#1976D2" font-family="Arial">% Thực tế</text>
    <text x="1670" y="634" font-size="13" fill="#1976D2" font-family="Arial">Chênh lệch</text>
    <text x="1760" y="634" font-size="13" fill="#1976D2" font-family="Arial">Trạng thái</text>
    <!-- Row 1 -->
    <rect x="1050" y="646" width="820" height="44" fill="#fff" stroke="#E0E0E0" />
    <text x="1070" y="672" font-size="12" fill="#212121" font-family="Arial">DA2025003</text>
    <text x="1150" y="672" font-size="12" fill="#212121" font-family="Arial">Cung cấp thiết bị mạng</text>
    <text x="1500" y="672" font-size="12" fill="#212121" font-family="Arial">60%</text>
    <text x="1570" y="672" font-size="12" fill="#212121" font-family="Arial">30%</text>
    <text x="1680" y="672" font-size="12" fill="#D32F2F" font-family="Arial">-30%</text>
    <rect x="1740" y="658" width="110" height="20" rx="10" fill="#D32F2F" />
    <text x="1795" y="672" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Chậm tiến độ</text>
    <!-- Row 2 -->
    <rect x="1050" y="690" width="820" height="44" fill="#FAFAFA" stroke="#E0E0E0" />
    <text x="1070" y="716" font-size="12" fill="#212121" font-family="Arial">DA2025008</text>
    <text x="1150" y="716" font-size="12" fill="#212121" font-family="Arial">Triển khai phần mềm C</text>
    <text x="1500" y="716" font-size="12" fill="#212121" font-family="Arial">50%</text>
    <text x="1570" y="716" font-size="12" fill="#212121" font-family="Arial">35%</text>
    <text x="1680" y="716" font-size="12" fill="#D32F2F" font-family="Arial">-15%</text>
    <rect x="1740" y="702" width="110" height="20" rx="10" fill="#D32F2F" />
    <text x="1795" y="716" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Chậm tiến độ</text>
    <!-- Row 3 -->
    <rect x="1050" y="734" width="820" height="44" fill="#fff" stroke="#E0E0E0" />
    <text x="1070" y="760" font-size="12" fill="#212121" font-family="Arial">DA2025011</text>
    <text x="1150" y="760" font-size="12" fill="#212121" font-family="Arial">Nâng cấp hạ tầng mạng</text>
    <text x="1500" y="760" font-size="12" fill="#212121" font-family="Arial">75%</text>
    <text x="1570" y="760" font-size="12" fill="#212121" font-family="Arial">60%</text>
    <text x="1680" y="760" font-size="12" fill="#D32F2F" font-family="Arial">-15%</text>
    <rect x="1740" y="746" width="110" height="20" rx="10" fill="#D32F2F" />
    <text x="1795" y="760" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Chậm tiến độ</text>
    <!-- Ghi chú -->
    <text x="1070" y="820" font-size="12" fill="#757575" font-family="Arial">Hiển thị top 3 dự án có chênh lệch lớn nhất (Thực tế nhỏ hơn Kế hoạch).</text>
  </g>

  <!-- Footer hints -->
  <text x="250" y="1010" font-size="12" fill="#757575" font-family="Arial">Gợi ý: Nhấp vào KPI để drill-down, nhấp vào cảnh báo để lọc nhanh.</text>
</svg>
