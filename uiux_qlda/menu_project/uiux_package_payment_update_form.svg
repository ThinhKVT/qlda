<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#F5F7FA;font-family:Arial">
  <!-- Overlay mờ nền -->
  <rect x="0" y="0" width="1920" height="1080" fill="#000" fill-opacity="0.35" />

  <!-- Modal Container -->
  <g id="payment-actual-modal">
    <rect x="560" y="120" width="960" height="780" rx="16" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" />
    <rect x="560" y="120" width="960" height="72" rx="16" fill="#1976D2" />
    <text x="600" y="165" font-size="24" fill="#fff" font-weight="bold">Cập nhật thanh toán thực tế - Đợt 1</text>

    <!-- Nút đóng -->
    <g cursor="pointer">
      <rect x="1456" y="138" width="44" height="44" rx="8" fill="#1565C0" />
      <line x1="1468" y1="150" x2="1488" y2="170" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      <line x1="1488" y1="150" x2="1468" y2="170" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Cột trái: thông tin cần nhập -->
    <text x="600" y="230" font-size="16" fill="#1976D2" font-weight="bold">Thông tin thực tế (bắt buộc)</text>

    <!-- Ngày thanh toán thực tế -->
    <text x="600" y="264" font-size="13" fill="#212121">Ngày thanh toán thực tế *</text>
    <rect x="600" y="272" width="240" height="40" rx="8" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="610" y="297" font-size="13" fill="#9E9E9E">dd/mm/yyyy</text>
    <circle cx="820" cy="292" r="10" fill="#1976D2" />
    <text x="815" y="297" font-size="12" fill="#fff" font-weight="bold">📅</text>

    <!-- Giá trị thanh toán thực tế -->
    <text x="600" y="334" font-size="13" fill="#212121">Giá trị thanh toán thực tế (VND) *</text>
    <rect x="600" y="342" width="300" height="40" rx="8" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="610" y="367" font-size="13" fill="#9E9E9E">VD: 300.000.000</text>

    <!-- Số chứng từ -->
    <text x="600" y="404" font-size="13" fill="#212121">Số chứng từ *</text>
    <rect x="600" y="412" width="300" height="40" rx="8" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="610" y="437" font-size="13" fill="#9E9E9E">Nhập số chứng từ</text>

    <!-- Hồ sơ thanh toán -->
    <text x="600" y="474" font-size="13" fill="#212121">Hồ sơ thanh toán *</text>
    <rect x="600" y="482" width="520" height="90" rx="8" fill="#FAFAFA" stroke="#E53935" stroke-dasharray="4 4" stroke-width="2" />
    <text x="610" y="506" font-size="13" fill="#757575">Kéo và thả file hoặc bấm để tải lên</text>
    <text x="610" y="526" font-size="12" fill="#9E9E9E">Định dạng: PDF/Doc/Ảnh | Tối đa: 20MB</text>
    <rect x="1080" y="482" width="40" height="40" rx="8" fill="#1976D2" />
    <text x="1100" y="508" font-size="18" fill="#fff" text-anchor="middle">+</text>

    <!-- Ghi chú tùy chọn -->
    <text x="600" y="594" font-size="13" fill="#212121">Ghi chú (tuỳ chọn)</text>
    <rect x="600" y="602" width="520" height="100" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="610" y="625" font-size="13" fill="#9E9E9E">Nhập ghi chú (nếu có)</text>

    <!-- Divider dọc -->
    <rect x="1160" y="224" width="1" height="500" fill="#E0E0E0" />

    <!-- Cột phải: thông tin đối chiếu & trạng thái -->
    <text x="1190" y="230" font-size="16" fill="#1976D2" font-weight="bold">Đối chiếu dự kiến</text>

    <text x="1190" y="264" font-size="12" fill="#616161">Ngày thanh toán dự kiến</text>
    <rect x="1190" y="272" width="240" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="297" font-size="13" fill="#616161">01/10/2025</text>

    <text x="1190" y="334" font-size="12" fill="#616161">Giá trị dự kiến (VND)</text>
    <rect x="1190" y="342" width="260" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="367" font-size="13" fill="#616161">300.000.000</text>

    <text x="1190" y="404" font-size="12" fill="#616161">Tỷ lệ dự kiến (%)</text>
    <rect x="1190" y="412" width="180" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="437" font-size="13" fill="#616161">15%</text>

    <text x="1190" y="474" font-size="12" fill="#616161">Trạng thái sau khi lưu</text>
    <rect x="1190" y="482" width="220" height="40" rx="8" fill="#E3F2FD" stroke="#1976D2" />
    <text x="1200" y="507" font-size="13" fill="#1976D2">Đã thanh toán</text>

    <text x="1190" y="544" font-size="12" fill="#616161">Tổng giá trị đã thanh toán (sau lưu)</text>
    <rect x="1190" y="552" width="260" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="577" font-size="13" fill="#616161">1.200.000.000 / 2.000.000.000 (60%)</text>

    <!-- Cảnh báo hợp lệ -->
    <rect x="600" y="720" width="760" height="60" rx="10" fill="#FFF8E1" stroke="#FFB300" />
    <circle cx="620" cy="750" r="14" fill="#FFB300" />
    <text x="615" y="755" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
    <text x="644" y="742" font-size="12" fill="#795548">Tất cả trường * là bắt buộc. Hồ sơ thanh toán phải có tối thiểu 1 file hợp lệ.</text>
    <text x="644" y="760" font-size="12" fill="#795548">Sau khi Lưu, giá trị Ngày thanh toán và Giá trị (VND) của dòng sẽ trở thành giá trị thực tế.</text>

    <!-- Footer buttons -->
    <g id="modal-footer-buttons">
      <rect x="1040" y="840" width="130" height="44" rx="8" fill="#ECEFF1" stroke="#B0BEC5" />
      <text x="1105" y="868" font-size="16" fill="#37474F" text-anchor="middle">Hủy</text>
      <rect x="1190" y="840" width="170" height="44" rx="8" fill="#B0BEC5" />
      <text x="1275" y="868" font-size="16" fill="#fff" text-anchor="middle">Lưu</text>
      <text x="1275" y="888" font-size="10" fill="#9E9E9E" text-anchor="middle">(Bị khóa cho tới khi hợp lệ)</text>
    </g>
  </g>
</svg>
