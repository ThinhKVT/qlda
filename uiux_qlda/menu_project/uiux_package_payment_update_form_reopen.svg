<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#F5F7FA;font-family:Arial">
  <!-- Overlay -->
  <rect x="0" y="0" width="1920" height="1080" fill="#000" fill-opacity="0.35" />
  <!-- Modal -->
  <g id="payment-actual-modal-edit">
    <rect x="560" y="120" width="960" height="780" rx="16" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" />
    <rect x="560" y="120" width="960" height="72" rx="16" fill="#2E7D32" />
    <text x="600" y="165" font-size="24" fill="#fff" font-weight="bold">Chỉnh sửa thanh toán thực tế - Đợt 1</text>
    <g cursor="pointer">
      <rect x="1456" y="138" width="44" height="44" rx="8" fill="#1B5E20" />
      <line x1="1468" y1="150" x2="1488" y2="170" stroke="#fff" stroke-width="3" stroke-linecap="round" />
      <line x1="1488" y1="150" x2="1468" y2="170" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Left column actual fields (prefilled) -->
    <text x="600" y="230" font-size="16" fill="#2E7D32" font-weight="bold">Giá trị thực tế</text>

    <text x="600" y="264" font-size="13" fill="#212121">Ngày thanh toán thực tế *</text>
    <rect x="600" y="272" width="240" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="610" y="297" font-size="13" fill="#2E7D32">15/10/2025</text>

    <text x="600" y="334" font-size="13" fill="#212121">Giá trị thanh toán thực tế (VND) *</text>
    <rect x="600" y="342" width="300" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="610" y="367" font-size="13" fill="#2E7D32">300.000.000</text>

    <text x="600" y="404" font-size="13" fill="#212121">Số chứng từ *</text>
    <rect x="600" y="412" width="300" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="610" y="437" font-size="13" fill="#2E7D32">PT-0001</text>

    <text x="600" y="474" font-size="13" fill="#212121">Hồ sơ thanh toán *</text>
    <rect x="600" y="482" width="520" height="150" rx="8" fill="#FAFAFA" stroke="#2E7D32" stroke-width="1" />
    <text x="610" y="503" font-size="12" fill="#616161">Danh sách file đã tải lên</text>

    <!-- File list items -->
    <g id="file-list" transform="translate(610,512)">
      <!-- File 1 -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="480" height="34" rx="6" fill="#E3F2FD" stroke="#90CAF9" />
        <rect x="10" y="6" width="20" height="22" rx="4" fill="#1976D2" />
        <text x="22" y="22" font-size="12" fill="#fff" text-anchor="middle">PDF</text>
        <text x="40" y="22" font-size="12" fill="#0D47A1">hs_thanhtoan_dot1.pdf (340KB)</text>
        <rect x="448" y="6" width="22" height="22" rx="4" fill="#EF5350" cursor="pointer" />
        <text x="459" y="22" font-size="14" fill="#fff" text-anchor="middle">×</text>
      </g>
      <!-- File 2 -->
      <g transform="translate(0,40)">
        <rect x="0" y="0" width="480" height="34" rx="6" fill="#E3F2FD" stroke="#90CAF9" />
        <rect x="10" y="6" width="20" height="22" rx="4" fill="#1976D2" />
        <text x="22" y="22" font-size="12" fill="#fff" text-anchor="middle">IMG</text>
        <text x="40" y="22" font-size="12" fill="#0D47A1">bien_ban_nghiem_thu.jpg (1.2MB)</text>
        <rect x="448" y="6" width="22" height="22" rx="4" fill="#EF5350" cursor="pointer" />
        <text x="459" y="22" font-size="14" fill="#fff" text-anchor="middle">×</text>
      </g>
      <!-- Upload more -->
      <g transform="translate(0,80)" cursor="pointer">
        <rect x="0" y="0" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-dasharray="4 4" />
        <text x="90" y="22" font-size="12" fill="#1976D2" text-anchor="middle">+ Thêm file</text>
      </g>
    </g>

    <text x="600" y="660" font-size="13" fill="#212121">Ghi chú (tuỳ chọn)</text>
    <rect x="600" y="668" width="520" height="100" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="610" y="691" font-size="13" fill="#616161">Đợt nghiệm thu phần cọc móng</text>

    <!-- Divider -->
    <rect x="1160" y="224" width="1" height="500" fill="#E0E0E0" />

    <!-- Right column comparison -->
    <text x="1190" y="230" font-size="16" fill="#2E7D32" font-weight="bold">Đối chiếu</text>
    <text x="1190" y="264" font-size="12" fill="#616161">Ngày dự kiến ban đầu</text>
    <rect x="1190" y="272" width="240" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="297" font-size="13" fill="#616161">01/10/2025</text>

    <text x="1190" y="334" font-size="12" fill="#616161">Giá trị dự kiến ban đầu (VND)</text>
    <rect x="1190" y="342" width="260" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="367" font-size="13" fill="#616161">300.000.000</text>

    <text x="1190" y="404" font-size="12" fill="#616161">Tỷ lệ theo thực tế (%)</text>
    <rect x="1190" y="412" width="180" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="1200" y="437" font-size="13" fill="#2E7D32">15%</text>

    <text x="1190" y="474" font-size="12" fill="#616161">Trạng thái</text>
    <rect x="1190" y="482" width="220" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" />
    <text x="1200" y="507" font-size="13" fill="#2E7D32">Đã thanh toán</text>

    <text x="1190" y="544" font-size="12" fill="#616161">Tổng giá trị đã thanh toán</text>
    <rect x="1190" y="552" width="260" height="40" rx="8" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="1200" y="577" font-size="13" fill="#616161">1.200.000.000 / 2.000.000.000 (60%)</text>

    <!-- Alert -->
    <rect x="600" y="790" width="760" height="60" rx="10" fill="#E8F5E9" stroke="#2E7D32" />
    <circle cx="620" cy="820" r="14" fill="#2E7D32" />
    <text x="615" y="825" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">i</text>
    <text x="644" y="812" font-size="12" fill="#2E7D32">Có thể xoá / thêm file bổ sung khi chỉnh sửa.</text>
    <text x="644" y="830" font-size="12" fill="#2E7D32">Nhật ký chỉnh sửa sẽ được ghi vào Audit Log.</text>

    <!-- Footer -->
    <g id="footer-buttons">
      <rect x="1040" y="860" width="130" height="44" rx="8" fill="#ECEFF1" stroke="#B0BEC5" />
      <text x="1105" y="888" font-size="16" fill="#37474F" text-anchor="middle">Đóng</text>
      <rect x="1190" y="860" width="170" height="44" rx="8" fill="#2E7D32" />
      <text x="1275" y="888" font-size="16" fill="#fff" text-anchor="middle">Cập nhật</text>
    </g>
  </g>
  <!-- Comments: Reopen modal cho phép chỉnh sửa giá trị thực tế & quản lý danh sách file -->
</svg>
