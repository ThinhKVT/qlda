<svg width="600" height="460" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Form thêm nhân sự (standalone) -->
  <rect x="40" y="30" width="520" height="380" rx="16" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="65" font-size="22" fill="#1976D2" font-family="Arial" text-anchor="middle">Thêm nhân sự dự án</text>
  <!-- Họ và tên -->
  <text x="70" y="120" font-size="16" fill="#212121" font-family="Arial">Họ và tên</text>
  <rect x="180" y="100" width="340" height="36" rx="6" fill="#E3F2FD" stroke="#BDBDBD" />
  <text x="190" y="125" font-size="15" fill="#757575" font-family="Arial">Chọn 1 hoặc nhiều từ CSDL nhân sự</text>
  <!-- Tổ/nhóm (dropdown) -->
  <text x="70" y="170" font-size="16" fill="#212121" font-family="Arial">Tổ/nhóm</text>
  <g>
    <rect x="180" y="150" width="200" height="36" rx="6" fill="#E3F2FD" stroke="#BDBDBD" />
    <text x="190" y="175" font-size="15" fill="#757575" font-family="Arial">Dropdown: Tổ chuyên gia, ...</text>
    <polygon points="360,165 375,165 367.5,180" fill="#757575" />
  </g>
  <!-- Vai trò (dropdown) -->
  <text x="70" y="220" font-size="16" fill="#212121" font-family="Arial">Vai trò</text>
  <g>
    <rect x="180" y="200" width="200" height="36" rx="6" fill="#E3F2FD" stroke="#BDBDBD" />
    <text x="190" y="225" font-size="15" fill="#757575" font-family="Arial">Dropdown: Tổ trưởng, ...</text>
    <polygon points="360,215 375,215 367.5,230" fill="#757575" />
  </g>
  <!-- Phòng ban -->
  <text x="70" y="270" font-size="16" fill="#212121" font-family="Arial">Phòng ban</text>
  <rect x="180" y="250" width="260" height="36" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="190" y="275" font-size="15" fill="#757575" font-family="Arial">Tự động lấy từ CSDL</text>
  <!-- Email -->
  <text x="70" y="320" font-size="16" fill="#212121" font-family="Arial">Email</text>
  <rect x="180" y="300" width="260" height="36" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="190" y="325" font-size="15" fill="#757575" font-family="Arial">Tự động lấy từ CSDL</text>
  <!-- Nút Lưu và Hủy -->
  <rect x="180" y="360" width="100" height="40" rx="8" fill="#1976D2" />
  <text x="230" y="387" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Lưu</text>
  <rect x="300" y="360" width="100" height="40" rx="8" fill="#BDBDBD" />
  <text x="350" y="387" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Hủy</text>
</svg>
