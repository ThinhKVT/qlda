  <text x="350" y="211" font-size="15" fill="#212121" font-family="Arial">DA2025001</text>
  <text x="450" y="211" font-size="15" fill="#212121" font-family="Arial">Dự án CNTT</text>
  <text x="620" y="211" font-size="15" fill="#212121" font-family="Arial">Dự án</text>
