  <text x="1760" y="291" font-size="15" fill="#1976D2" font-family="Arial">Xem | Sửa | Xóa</text>
  <!-- Nút Xuất báo cáo đã chọn căn chỉnh lại -->
  <rect x="380" y="420" width="220" height="36" rx="8" fill="#43A047" />
  <text x="420" y="445" font-size="15" fill="#fff" font-family="Arial">Xuất báo cáo đã chọn</text>
  <!-- Pagination: move to bottom right of table -->
  <rect x="1670" y="420" width="200" height="36" rx="8" fill="#E3F2FD" />
