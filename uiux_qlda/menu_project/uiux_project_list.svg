    <text x="760" y="445" font-size="15" fill="#757575" font-family="Arial">Chọn cán bộ</text>
    <text x="630" y="480" font-size="15" fill="#212121" font-family="Arial">Cán bộ QLDA:</text>
    <rect x="750" y="465" width="200" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="760" y="485" font-size="15" fill="#757575" font-family="Arial">Chọn cán bộ</text>
    <text x="630" y="520" font-size="15" fill="#212121" font-family="Arial">Ngày bắt đầu:</text>
    <rect x="750" y="505" width="200" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="760" y="525" font-size="15" fill="#757575" font-family="Arial">Chọn ngày</text>
    <text x="630" y="560" font-size="15" fill="#212121" font-family="Arial">Ngày kết thúc:</text>
    <rect x="750" y="545" width="200" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
