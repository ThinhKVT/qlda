  <text x="250" y="400" font-size="14" fill="#757575" font-family="Arial">Tất cả 3 bản ghi - Hiển thị 1-5/100 bản ghi</text>
  <!-- COMMENT: Record count display -->
  <!-- Multi-select actions -->
  <rect x="250" y="420" width="120" height="36" rx="8" fill="#1976D2" />
  <text x="270" y="445" font-size="15" fill="#fff" font-family="Arial">Xóa đã chọn</text>
