  <text x="950" y="211" font-size="15" fill="#212121" font-family="Arial">thinhnv8</text>
  <text x="1120" y="211" font-size="15" fill="#212121" font-family="Arial">lannv1</text>
  <text x="1290" y="211" font-size="15" fill="#212121" font-family="Arial">2025</text>
