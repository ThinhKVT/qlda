<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
