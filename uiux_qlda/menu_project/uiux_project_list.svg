    <text x="630" y="360" font-size="15" fill="#212121" font-family="Arial">Năm kế hoạch:</text>
    <rect x="750" y="345" width="200" height="32" rx="6" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="760" y="365" font-size="15" fill="#757575" font-family="Arial">Chọn năm</text>
    <text x="630" y="400" font-size="15" fill="#212121" font-family="Arial">Trạng thái:</text>
