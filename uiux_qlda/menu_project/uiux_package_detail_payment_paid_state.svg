<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="400" xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF;font-family:Arial">
  <!-- Bảng thanh toán - trạng thái sau khi 1 đợt đã thanh toán -->
  <text x="250" y="40" font-size="20" fill="#1976D2" font-weight="bold">Gói thầu - Tab Thanh toán (Hàng sau khi đã thanh toán)</text>
  <!-- Header -->
  <rect x="250" y="60" width="1620" height="40" fill="#E3F2FD" />
  <text x="270" y="86" font-size="14" fill="#1976D2">Đợt</text>
  <text x="340" y="86" font-size="14" fill="#1976D2">Ngày thanh toán</text>
  <text x="510" y="86" font-size="14" fill="#1976D2">Giá trị (VND)</text>
  <text x="690" y="86" font-size="14" fill="#1976D2">Tỷ lệ (%)</text>
  <text x="840" y="86" font-size="14" fill="#1976D2">Trạng thái</text>
  <text x="1010" y="86" font-size="14" fill="#1976D2">Số chứng từ</text>
  <text x="1180" y="86" font-size="14" fill="#1976D2">Ghi chú</text>
  <text x="1330" y="86" font-size="14" fill="#1976D2">Hồ sơ thanh toán</text>
  <text x="1540" y="86" font-size="14" fill="#1976D2">Hành động</text>

  <!-- Row (Paid) -->
  <rect x="250" y="100" width="1620" height="56" fill="#E8F5E9" stroke="#C8E6C9" />
  <text x="270" y="133" font-size="14" fill="#212121">Đợt 1</text>
  <!-- Actual date -->
  <rect x="330" y="112" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#2E7D32" />
  <text x="338" y="131" font-size="12" fill="#2E7D32">15/10/2025</text>
  <!-- Actual amount -->
  <rect x="500" y="112" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#2E7D32" />
  <text x="508" y="131" font-size="12" fill="#2E7D32">300.000.000</text>
  <!-- Ratio -->
  <rect x="680" y="112" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#A5D6A7" />
  <text x="688" y="131" font-size="12" fill="#2E7D32">15%</text>
  <!-- Status -->
  <rect x="830" y="112" width="150" height="28" rx="6" fill="#2E7D32" />
  <text x="905" y="131" font-size="12" fill="#fff" text-anchor="middle">Đã thanh toán</text>
  <!-- Voucher -->
  <rect x="1000" y="112" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#2E7D32" />
  <text x="1008" y="131" font-size="12" fill="#2E7D32">PT-0001</text>
  <!-- Note -->
  <rect x="1170" y="112" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#BDBDBD" />
  <text x="1178" y="131" font-size="12" fill="#616161">Nghiệm thu móng</text>
  <!-- Attachments -->
  <rect x="1310" y="112" width="180" height="28" rx="6" fill="#FFFFFF" stroke="#2E7D32" />
  <text x="1320" y="131" font-size="12" fill="#2E7D32">Đã đính kèm (2)</text>
  <!-- Actions -->
  <g id="actions-paid-row1" transform="translate(1500,110)">
    <!-- View -->
    <g cursor="pointer">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#E3F2FD" stroke="#1976D2" />
      <ellipse cx="16" cy="16" rx="10" ry="7" fill="none" stroke="#1976D2" stroke-width="2" />
      <circle cx="16" cy="16" r="3" fill="#1976D2" />
    </g>
    <!-- Edit -->
    <g cursor="pointer" transform="translate(40,0)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#E8F5E9" stroke="#2E7D32" />
      <path d="M8 22 L8 24 L10 24 L22 12 L20 10 Z" fill="#2E7D32" />
      <path d="M18 8 L20 10" stroke="#2E7D32" stroke-width="2" />
    </g>
    <!-- Delete (disabled visual) -->
    <g transform="translate(80,0)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#F5F5F5" stroke="#E0E0E0" />
      <rect x="10" y="12" width="12" height="14" fill="none" stroke="#BDBDBD" stroke-width="2" />
      <line x1="8" y1="12" x2="24" y2="12" stroke="#BDBDBD" stroke-width="2" />
      <line x1="14" y1="16" x2="14" y2="22" stroke="#BDBDBD" stroke-width="2" />
      <line x1="18" y1="16" x2="18" y2="22" stroke="#BDBDBD" stroke-width="2" />
      <line x1="14" y1="8" x2="18" y2="8" stroke="#BDBDBD" stroke-width="2" />
    </g>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(250,190)">
    <rect x="0" y="0" width="460" height="140" rx="10" fill="#FAFAFA" stroke="#E0E0E0" />
    <text x="20" y="30" font-size="14" fill="#212121" font-weight="bold">Chú thích</text>
    <text x="20" y="55" font-size="12" fill="#212121">• Hàng màu xanh nhạt: đợt đã được xác nhận thanh toán (PAID).</text>
    <text x="20" y="73" font-size="12" fill="#212121">• Cột Ngày và Giá trị hiển thị giá trị thực tế (actual).</text>
    <text x="20" y="91" font-size="12" fill="#212121">• Nút Xoá bị vô hiệu hóa với đợt đã thanh toán.</text>
    <text x="20" y="109" font-size="12" fill="#212121">• Edit mở modal chỉnh sửa thực tế: `uiux_package_payment_update_form_reopen.svg`.</text>
    <text x="20" y="127" font-size="12" fill="#212121">• View xem nhanh chi tiết và hồ sơ đính kèm.</text>
  </g>
</svg>
