<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!--
    CHÚ THÍCH NGHIỆP VỤ:
    - Các giai đoạn tiến độ của gói thầu sẽ được hiển thị và quản lý theo logic của loại dự án cha (tham khảo chi tiết ở file uiux_project_detail.svg).
    - Khi thêm mới gói thầu vào dự án, các giai đoạn tiến độ tương ứng sẽ được tự động cập nhật vào tab Tiến độ của dự án theo loại dự án (Dự án, Phương án mua sắm hàng hoá, Phương án mua sắm dịch vụ, Phương án bảo trì).
    - Nếu có nhiều gói thầu, giao diện tab Tiến độ sẽ xuất hiện thanh cuộn để xem hết các giai đoạn.
  -->
  <!-- Sidebar chỉnh giống project_detail -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (mới) -->
  <rect x="0" y="100" width="220" height="50" fill="#1976D2" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <rect x="0" y="150" width="220" height="50" fill="#1565C0" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <!-- Icon dự án -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <!-- Icon hợp đồng -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <rect x="0" y="250" width="220" height="50" fill="#1976D2" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <!-- Icon nhà thầu -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <!-- Icon kho tri thức -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>
  <!-- Topbar -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <!-- Back button -->
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết gói thầu</text>
  <!-- Notification button (chuông giống project_detail) -->
  <g id="notification-button" cursor="pointer">
    <circle cx="1800" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <path d="M1800 22 a10 10 0 0 1 10 10 v4 a10 10 0 0 0 2 6 l2 2 h-28 l2-2 a10 10 0 0 0 2-6 v-4 a10 10 0 0 1 10-10z" fill="#1976D2" />
    <circle cx="1812" cy="22" r="4" fill="#E53935" />
    <rect x="1795" y="40" width="10" height="4" rx="2" fill="#1976D2" />
  </g>
  <!-- Setting button (bánh răng giống project_detail) -->
  <g id="setting-button" cursor="pointer">
    <circle cx="1850" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <g>
      <circle cx="1850" cy="32" r="7" fill="#1976D2" />
      <g stroke="#1976D2" stroke-width="2">
        <line x1="1850" y1="17" x2="1850" y2="22" />
        <line x1="1850" y1="42" x2="1850" y2="47" />
        <line x1="1835" y1="32" x2="1840" y2="32" />
        <line x1="1860" y1="32" x2="1865" y2="32" />
        <line x1="1840.5" y1="22.5" x2="1844" y2="26" />
        <line x1="1856" y1="38" x2="1859.5" y2="41.5" />
        <line x1="1840.5" y1="41.5" x2="1844" y2="38" />
        <line x1="1856" y1="26" x2="1859.5" y2="22.5" />
      </g>
    </g>
  </g>
  <!-- Info Card -->
  <rect x="250" y="100" width="1620" height="180" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="140" font-size="22" fill="#1976D2" font-family="Arial">Gói thầu: Tên gói thầu</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Lĩnh vực: Mua sắm</text>
  <text x="270" y="210" font-size="16" fill="#212121" font-family="Arial">Giá gói thầu: 2 tỷ VND</text>
  <text x="270" y="240" font-size="16" fill="#212121" font-family="Arial">Thời gian thực hiện: 6 tháng</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Nguồn vốn: Ngân sách nhà nước</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">Hình thức LCNT: Đấu thầu rộng rãi</text>
  <text x="600" y="240" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang đấu thầu</text>
  <text x="1000" y="180" font-size="16" fill="#212121" font-family="Arial">Phương thức LCNT: 1 giai đoạn 2 túi hồ sơ</text>
  <text x="1000" y="210" font-size="16" fill="#212121" font-family="Arial">Loại hợp đồng: Trọn gói</text>
  <text x="1400" y="180" font-size="16" fill="#212121" font-family="Arial">Thời gian TCLCNT: 30 ngày</text>
  <text x="1400" y="210" font-size="16" fill="#212121" font-family="Arial">Thời gian bắt đầu TCLCNT: Quý 1/2025</text>
  <!-- Tabs as tab style (no rounded corners, 4 tabs, data-toggle="tab" style) -->
  <g>
    <!-- Active: Thông tin hợp đồng -->
    <rect x="250" y="300" width="180" height="40" fill="#1976D2" />
    <text x="340" y="325" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Thông tin hợp đồng</text>
    <rect x="430" y="300" width="140" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="500" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Thanh toán</text>
    <rect x="570" y="300" width="120" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="630" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <!-- Tab underline for active tab -->
    <rect x="250" y="340" width="180" height="4" fill="#1976D2" />
  </g>

  <!-- Section: Thông tin hợp đồng (thay cho bảng tài liệu) -->
  <rect x="250" y="360" width="1620" height="40" fill="#E3F2FD" />
  <text x="270" y="385" font-size="16" fill="#1976D2" font-family="Arial">Thông tin hợp đồng (readonly - đồng bộ từ tab "Ký hợp đồng")</text>

  <!-- Dòng 1: Tên hợp đồng (theo tên gói thầu) -->
  <text x="270" y="430" font-size="15" fill="#212121" font-family="Arial">Tên hợp đồng</text>
  <rect x="450" y="410" width="1400" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="435" font-size="14" fill="#212121" font-family="Arial">Tên gói thầu</text>

  <!-- Dòng 2: Số HĐ, Ngày ký, Loại HĐ -->
  <text x="270" y="480" font-size="15" fill="#212121" font-family="Arial">Số hợp đồng</text>
  <rect x="450" y="460" width="260" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="485" font-size="14" fill="#212121" font-family="Arial">HD-2025/001</text>

  <text x="750" y="480" font-size="15" fill="#212121" font-family="Arial">Ngày ký</text>
  <rect x="820" y="460" width="160" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="830" y="485" font-size="14" fill="#212121" font-family="Arial">23/05/2025</text>

  <text x="1000" y="480" font-size="15" fill="#212121" font-family="Arial">Loại hợp đồng</text>
  <rect x="1120" y="460" width="240" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="1130" y="485" font-size="14" fill="#212121" font-family="Arial">Trọn gói</text>

  <!-- Dòng 3: Ngày hiệu lực, Thời gian (tháng), Ngày hết hiệu lực -->
  <text x="270" y="530" font-size="15" fill="#212121" font-family="Arial">Ngày hiệu lực</text>
  <rect x="450" y="510" width="160" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="535" font-size="14" fill="#212121" font-family="Arial">23/05/2025</text>

  <text x="750" y="530" font-size="15" fill="#212121" font-family="Arial">Thời gian (tháng)</text>
  <rect x="910" y="510" width="120" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="920" y="535" font-size="14" fill="#212121" font-family="Arial">36</text>

  <text x="1080" y="530" font-size="15" fill="#212121" font-family="Arial">Ngày hết hiệu lực</text>
  <rect x="1240" y="510" width="200" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="1250" y="535" font-size="14" fill="#212121" font-family="Arial">23/05/2028</text>

  <!-- Dòng 4: Giá trị HĐ + Đơn vị -->
  <text x="270" y="580" font-size="15" fill="#212121" font-family="Arial">Giá trị hợp đồng</text>
  <rect x="450" y="560" width="280" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="585" font-size="14" fill="#212121" font-family="Arial">1.800.000.000</text>
  <rect x="740" y="560" width="90" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="750" y="585" font-size="14" fill="#212121" font-family="Arial">VND</text>

  <!-- Dòng 5: Nhà thầu -->
  <text x="270" y="630" font-size="15" fill="#212121" font-family="Arial">Nhà thầu</text>
  <rect x="450" y="610" width="1200" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="635" font-size="14" fill="#212121" font-family="Arial">Tổng công ty Xây dựng XYZ</text>

  <!-- Dòng 6: Số đợt thanh toán -->
  <text x="270" y="680" font-size="15" fill="#212121" font-family="Arial">Số đợt thanh toán</text>
  <rect x="450" y="660" width="120" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="460" y="685" font-size="14" fill="#212121" font-family="Arial">6</text>

  <!-- Ghi chú -->
  <text x="270" y="720" font-size="13" fill="#757575" font-family="Arial">Các thông tin này được đồng bộ tự động sau khi lưu form "Ký hợp đồng" ở màn hình chi tiết dự án/gói thầu.</text>
</svg>
