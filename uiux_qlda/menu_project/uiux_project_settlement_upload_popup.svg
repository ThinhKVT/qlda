<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- POPUP: UPLOAD HỒ SƠ QUYẾT TOÁN -->
  <rect x="40" y="30" width="1120" height="740" rx="20" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" />
  <text x="600" y="70" font-size="22" fill="#1976D2" font-family="Arial" text-anchor="middle">Upload hồ sơ quyết toán</text>
  <rect x="1070" y="48" width="60" height="28" rx="8" fill="#BDBDBD" />
  <text x="1100" y="68" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Đóng</text>

  <!-- Thông tin dự án tóm tắt -->
  <rect x="70" y="95" width="1060" height="80" rx="12" fill="#FAFAFA" stroke="#E0E0E0" />
  <text x="90" y="125" font-size="13" fill="#757575" font-family="Arial">Dự án</text>
  <text x="160" y="125" font-size="14" fill="#212121" font-family="Arial">Dự án A - Triển khai phần mềm</text>
  <text x="90" y="150" font-size="13" fill="#757575" font-family="Arial">Loại dự án</text>
  <text x="160" y="150" font-size="14" fill="#212121" font-family="Arial">Dự án</text>
  <text x="520" y="125" font-size="13" fill="#757575" font-family="Arial">Trạng thái quyết toán</text>
  <rect x="660" y="110" width="140" height="24" rx="12" fill="#FBC02D" />
  <text x="730" y="127" font-size="12" fill="#212121" font-family="Arial" text-anchor="middle">Đang quyết toán</text>

  <!-- Khu vực upload 3 loại hồ sơ -->
  <text x="70" y="210" font-size="14" fill="#1976D2" font-family="Arial">1) Tờ trình quyết toán</text>
  <rect x="70" y="220" width="1060" height="120" rx="12" fill="#FFF" stroke="#1976D2" stroke-dasharray="6 6" />
  <text x="600" y="275" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Kéo và thả hoặc Bấm để chọn tệp (PDF/DOCX)</text>
  <text x="90" y="310" font-size="12" fill="#757575" font-family="Arial">Tệp đã chọn: (ví dụ) totrinh_quyettoan.pdf</text>

  <text x="70" y="360" font-size="14" fill="#1976D2" font-family="Arial">2) Báo cáo thẩm định quyết toán</text>
  <rect x="70" y="370" width="1060" height="120" rx="12" fill="#FFF" stroke="#1976D2" stroke-dasharray="6 6" />
  <text x="600" y="425" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Kéo và thả hoặc Bấm để chọn tệp (PDF/DOCX)</text>
  <text x="90" y="460" font-size="12" fill="#757575" font-family="Arial">Tệp đã chọn: (ví dụ) baocao_thamdinh.docx</text>

  <text x="70" y="510" font-size="14" fill="#1976D2" font-family="Arial">3) Quyết định phê duyệt quyết toán</text>
  <rect x="70" y="520" width="1060" height="120" rx="12" fill="#FFF" stroke="#1976D2" stroke-dasharray="6 6" />
  <text x="600" y="575" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Kéo và thả hoặc Bấm để chọn tệp (PDF/DOCX)</text>
  <text x="90" y="610" font-size="12" fill="#757575" font-family="Arial">Tệp đã chọn: (ví dụ) quyetdinh_pheduyet_quyettoan.pdf</text>

  <!-- Ghi chú đồng bộ -->
  <text x="70" y="660" font-size="12" fill="#757575" font-family="Arial">Ghi chú: Các tệp hồ sơ tải lên tại đây sẽ tự động hiển thị trong tab "Tài liệu" của dự án.</text>

  <!-- Nút hành động -->
  <rect x="900" y="690" width="110" height="40" rx="10" fill="#1976D2" />
  <text x="955" y="716" font-size="13" fill="#fff" font-family="Arial" text-anchor="middle">Lưu</text>
  <rect x="1020" y="690" width="110" height="40" rx="10" fill="#BDBDBD" />
  <text x="1075" y="716" font-size="13" fill="#fff" font-family="Arial" text-anchor="middle">Đóng</text>

  <!-- COMMENT: Popup này phục vụ nút Upload tại cột "Hồ sơ quyết toán" trong tab Quyết toán. -->
</svg>
