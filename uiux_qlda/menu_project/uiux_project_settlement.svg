<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Sidebar (đồng bộ với project_detail) -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <rect x="0" y="100" width="220" height="50" fill="#1565C0" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <rect x="0" y="150" width="220" height="50" fill="#1976D2" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Gói thầu</text>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <!-- Topbar (same as project detail) -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <!-- Back button (đồng bộ với project_detail) -->
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết dự án</text>
  <!-- Notification & Setting buttons (topbar, right side) -->
  <g id="notification-button" cursor="pointer">
    <circle cx="1800" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <path d="M1792 36 Q1800 20 1808 36" stroke="#1976D2" stroke-width="2" fill="none" />
    <circle cx="1800" cy="38" r="3" fill="#1976D2" />
  </g>
  <g id="setting-button" cursor="pointer">
    <circle cx="1850" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <circle cx="1850" cy="32" r="7" fill="none" stroke="#1976D2" stroke-width="2" />
    <rect x="1847" y="25" width="6" height="14" rx="2" fill="#1976D2" />
  </g>
  <!-- Project Info Card (synchronized) -->
  <rect x="250" y="120" width="1620" height="120" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="150" font-size="20" fill="#1976D2" font-family="Arial">Dự án A</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Kinh phí đầu tư: 2 tỷ VND</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Tổng giá trị hợp đồng: 1.8 tỷ VND</text>
  <text x="950" y="180" font-size="16" fill="#212121" font-family="Arial">Loại kế hoạch: Mới</text>
  <text x="270" y="210" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang thực hiện</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">01/01/2025 - 31/12/2025</text>
  <text x="950" y="210" font-size="16" fill="#212121" font-family="Arial">Năm kế hoạch: 2025</text>
  <!-- Tabs -->
  <g>
    <rect x="250" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="325" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tiến độ</text>
    <rect x="400" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="475" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Gói thầu</text>
    <rect x="550" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="625" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhân sự</text>
    <rect x="700" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="775" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <rect x="850" y="290" width="150" height="40" fill="#1976D2" />
    <text x="925" y="315" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Quyết toán</text>
    <rect x="1000" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="1075" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhật ký</text>
    <rect x="850" y="330" width="150" height="4" fill="#1976D2" />
  </g>
  <!-- Settlement Table -->
  <rect x="250" y="350" width="1620" height="40" fill="#E3F2FD" />
  <text x="275" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">STT</text>
  <text x="400" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tên quyết toán</text>
  <text x="800" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Giá trị</text>
  <text x="1100" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Ngày quyết toán</text>
  <text x="1400" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Trạng thái</text>
  <text x="1600" y="375" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Chi tiết</text>
  <!-- Example rows -->
  <rect x="250" y="390" width="1620" height="48" fill="#fff" stroke="#E0E0E0" />
  <text x="275" y="420" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">1</text>
  <text x="400" y="420" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">Quyết toán lần 1</text>
  <text x="800" y="420" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">1 tỷ</text>
  <text x="1100" y="420" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">01/09/2025</text>
  <text x="1400" y="420" font-size="16" fill="#388E3C" font-family="Arial" text-anchor="middle">Đã duyệt</text>
  <text x="1600" y="420" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Xem</text>
  <rect x="250" y="438" width="1620" height="48" fill="#FAFAFA" stroke="#E0E0E0" />
  <text x="275" y="468" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">2</text>
  <text x="400" y="468" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">Quyết toán lần 2</text>
  <text x="800" y="468" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">0.8 tỷ</text>
  <text x="1100" y="468" font-size="16" fill="#212121" font-family="Arial" text-anchor="middle">10/09/2025</text>
  <text x="1400" y="468" font-size="16" fill="#FBC02D" font-family="Arial" text-anchor="middle">Chờ duyệt</text>
  <text x="1600" y="468" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Xem</text>
</svg>
