<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (mới) -->
  <rect x="0" y="100" width="220" height="50" fill="#1976D2" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <rect x="0" y="150" width="220" height="50" fill="#1565C0" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <rect x="0" y="250" width="220" height="50" fill="#1976D2" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>

  <!-- Topbar -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết dự án</text>
  <!-- Breadcrumb giống project_detail -->
  <text x="250" y="90" font-size="16" fill="#757575" font-family="Arial">Dự án &gt; Dự án A</text>
  <!-- Info Card giống project_detail -->
  <rect x="250" y="120" width="1620" height="120" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="150" font-size="20" fill="#1976D2" font-family="Arial">Dự án A</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Kinh phí đầu tư: 2 tỷ VND</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Tổng giá trị hợp đồng: 1.8 tỷ VND</text>
  <text x="950" y="180" font-size="16" fill="#212121" font-family="Arial">Loại kế hoạch: Mới</text>
  <text x="270" y="210" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang thực hiện</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">01/01/2025 - 31/12/2025</text>
  <text x="950" y="210" font-size="16" fill="#212121" font-family="Arial">Năm kế hoạch: 2025</text>
  <!-- Progress bar giống project_detail -->
  <rect x="250" y="250" width="1620" height="20" rx="10" fill="#E3F2FD" />
  <rect x="250" y="250" width="810" height="20" rx="10" fill="#1976D2" />
  <text x="1820" y="265" font-size="14" fill="#1976D2" font-family="Arial">50%</text>
  <!-- Tabs, Quyết toán active -->
  <g>
    <rect x="250" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="325" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tiến độ</text>
    <rect x="400" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="475" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Gói thầu</text>
    <rect x="550" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="625" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhân sự</text>
    <rect x="700" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="775" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <rect x="850" y="290" width="150" height="40" fill="#1976D2" />
    <text x="925" y="315" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Quyết toán</text>
    <rect x="850" y="330" width="150" height="4" fill="#1976D2" />
    <rect x="1000" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="1075" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhật ký</text>
  </g>
  <text x="250" y="350" font-size="12" fill="#757575" font-family="Arial">Ghi chú: Tab "Quyết toán" chỉ hiển thị với loại dự án là "Dự án" hoặc "Phương án mua sắm hàng hoá"; ẩn với "Phương án bảo trì" hoặc "Phương án mua sắm dịch vụ".</text>

  <!-- Header bảng Quyết toán -->
  <rect x="250" y="370" width="1620" height="40" fill="#E3F2FD" />
  <text x="270" y="395" font-size="14" fill="#1976D2" font-family="Arial">STT</text>
  <text x="320" y="395" font-size="14" fill="#1976D2" font-family="Arial">Tên dự án</text>
  <text x="620" y="395" font-size="14" fill="#1976D2" font-family="Arial">Loại dự án</text>
  <text x="830" y="395" font-size="14" fill="#1976D2" font-family="Arial">Giá trị quyết toán</text>
  <text x="1040" y="395" font-size="14" fill="#1976D2" font-family="Arial">Ngày quyết toán</text>
  <text x="1220" y="395" font-size="14" fill="#1976D2" font-family="Arial">Trạng thái</text>
  <text x="1360" y="395" font-size="14" fill="#1976D2" font-family="Arial">Ghi chú</text>
  <text x="1500" y="395" font-size="14" fill="#1976D2" font-family="Arial">Hồ sơ quyết toán</text>
  <text x="1720" y="395" font-size="14" fill="#1976D2" font-family="Arial">Hành động</text>

  <!-- Row duy nhất -->
  <rect x="250" y="410" width="1620" height="46" fill="#fff" stroke="#E0E0E0" />
  <text x="270" y="438" font-size="13" fill="#212121" font-family="Arial">1</text>
  <text x="320" y="438" font-size="13" fill="#212121" font-family="Arial">Dự án A - Triển khai phần mềm</text>
  <text x="620" y="438" font-size="13" fill="#212121" font-family="Arial">Dự án</text>
  <text x="830" y="438" font-size="13" fill="#212121" font-family="Arial">1.750.000.000</text>
  <text x="1040" y="438" font-size="13" fill="#212121" font-family="Arial">01/09/2025</text>
  <rect x="1200" y="422" width="110" height="20" rx="10" fill="#388E3C" />
  <text x="1255" y="436" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Đã quyết toán</text>
  <text x="1360" y="438" font-size="13" fill="#212121" font-family="Arial">Quyết toán theo BBNT-01</text>
  <!-- Badge trạng thái hồ sơ: TT (Tờ trình), TĐ (Thẩm định), QĐ (Quyết định) -->
  <g aria-label="Trạng thái hồ sơ">
    <!-- TT: done -->
    <g>
      <rect x="1460" y="422" width="48" height="24" rx="12" fill="#E8F5E9" stroke="#388E3C" />
      <text x="1484" y="438" font-size="12" fill="#388E3C" font-family="Arial" text-anchor="middle">TT ✓</text>
    </g>
    <!-- TĐ: fail -->
    <g>
      <rect x="1514" y="422" width="48" height="24" rx="12" fill="#FFEBEE" stroke="#D32F2F" />
      <text x="1538" y="438" font-size="12" fill="#D32F2F" font-family="Arial" text-anchor="middle">TĐ ×</text>
    </g>
    <!-- QĐ: done -->
    <g>
      <rect x="1568" y="422" width="48" height="24" rx="12" fill="#E8F5E9" stroke="#388E3C" />
      <text x="1592" y="438" font-size="12" fill="#388E3C" font-family="Arial" text-anchor="middle">QĐ ✓</text>
    </g>
  </g>
  <!-- Nút Upload thay cho danh sách văn bản -->
  <g cursor="pointer">
    <rect x="1624" y="420" width="90" height="24" rx="8" fill="#1976D2" />
    <text x="1669" y="437" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Upload</text>
  </g>
  <!-- Hành động: chỉ Sửa | Xoá -->
  <text x="1720" y="438" font-size="13" fill="#1976D2" font-family="Arial">Sửa | Xoá</text>

  <!-- Ghi chú đồng bộ tài liệu -->
  <text x="250" y="470" font-size="12" fill="#757575" font-family="Arial">Khi upload hồ sơ quyết toán tại tab này, hồ sơ sẽ tự động hiển thị ở tab "Tài liệu" (uiux_project_document).</text>
</svg>
