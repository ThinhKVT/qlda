<svg width="880" height="780" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Modal/Form Ký hợp đồng -->
  <rect x="40" y="20" width="800" height="720" rx="16" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="440" y="55" font-size="22" fill="#1976D2" font-family="Arial" text-anchor="middle">Ký hợp đồng</text>
  <text x="770" y="55" font-size="12" fill="#757575" font-family="Arial" text-anchor="end">* bắt buộc</text>

  <!-- Nhóm: Tiến độ (đưa lên trên) -->
  <text x="60" y="90" font-size="16" fill="#1976D2" font-family="Arial">Tiến độ giai đoạn "Ký hợp đồng"</text>

  <!-- Trạng thái -->
  <text x="60" y="125" font-size="15" fill="#212121" font-family="Arial">Trạng thái *</text>
  <g>
    <rect x="260" y="105" width="220" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="270" y="130" font-size="14" fill="#212121" font-family="Arial">Chưa thực hiện</text>
    <polygon points="450,120 465,120 457.5,135" fill="#1976D2" />
  </g>
  <text x="500" y="125" font-size="12" fill="#757575" font-family="Arial">Quy tắc: Muốn chuyển sang "Đang thực hiện" phải nhập Ngày bắt đầu &amp; Ngày kết thúc</text>

  <!-- Ngày bắt đầu (thiếu -> lỗi) -->
  <text x="60" y="175" font-size="15" fill="#212121" font-family="Arial">Ngày bắt đầu *</text>
  <g>
    <rect x="260" y="155" width="140" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="268" y="180" font-size="14" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
    <rect x="380" y="163" width="12" height="12" fill="#1976D2" rx="2" />
    <text x="260" y="195" font-size="12" fill="#E53935" font-family="Arial">* Bắt buộc khi chuyển sang "Đang thực hiện"</text>
  </g>

  <!-- Ngày kết thúc (thiếu -> lỗi) -->
  <text x="440" y="175" font-size="15" fill="#212121" font-family="Arial">Ngày kết thúc *</text>
  <g>
    <rect x="600" y="155" width="140" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="608" y="180" font-size="14" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
    <rect x="720" y="163" width="12" height="12" fill="#1976D2" rx="2" />
    <text x="600" y="195" font-size="12" fill="#E53935" font-family="Arial">* Bắt buộc khi chuyển sang "Đang thực hiện"</text>
  </g>

  <!-- Ngày hoàn thành (conditional required when status=Đã hoàn thành) -->
  <text x="60" y="225" font-size="15" fill="#212121" font-family="Arial">Ngày hoàn thành <tspan font-size="12" fill="#757575">(bắt buộc khi chọn "Đã hoàn thành")</tspan></text>
  <g>
    <rect x="260" y="205" width="140" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="268" y="230" font-size="14" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
    <rect x="380" y="213" width="12" height="12" fill="#1976D2" rx="2" />
  </g>

  <!-- Chi tiết tiến độ (optional) -->
  <text x="440" y="225" font-size="15" fill="#212121" font-family="Arial">Chi tiết tiến độ <tspan font-size="12" fill="#757575">(không bắt buộc)</tspan></text>
  <rect x="600" y="205" width="230" height="60" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="608" y="223" font-size="13" fill="#757575" font-family="Arial">Nhập mô tả ngắn...</text>

  <!-- Phân cách -->
  <line x1="60" y1="280" x2="820" y2="280" stroke="#E0E0E0" />

  <!-- Nhóm: Thông tin hợp đồng (đưa xuống dưới) -->
  <text x="60" y="310" font-size="16" fill="#1976D2" font-family="Arial">Thông tin hợp đồng</text>

  <!-- 1. Tên hợp đồng (auto, cho phép sửa) -->
  <text x="60" y="345" font-size="15" fill="#212121" font-family="Arial">Tên hợp đồng *</text>
  <rect x="260" y="325" width="540" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
  <text x="270" y="350" font-size="14" fill="#757575" font-family="Arial">Mặc định theo tên gói thầu (có thể chỉnh sửa)</text>

  <!-- 2. Số hợp đồng (thiếu dữ liệu -> báo lỗi) -->
  <text x="60" y="395" font-size="15" fill="#212121" font-family="Arial">Số hợp đồng *</text>
  <rect x="260" y="375" width="260" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
  <text x="270" y="400" font-size="14" fill="#757575" font-family="Arial">Nhập số hợp đồng</text>
  <text x="260" y="420" font-size="12" fill="#E53935" font-family="Arial">* Vui lòng nhập số hợp đồng</text>

  <!-- 3. Ngày ký hợp đồng -->
  <text x="540" y="395" font-size="15" fill="#212121" font-family="Arial">Ngày ký hợp đồng *</text>
  <g>
    <rect x="700" y="375" width="100" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="708" y="400" font-size="14" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
    <!-- icon lịch đơn giản -->
    <rect x="780" y="383" width="12" height="12" fill="#1976D2" rx="2" />
  </g>

  <!-- 4. Ngày hiệu lực hợp đồng (thiếu dữ liệu -> báo lỗi) -->
  <text x="60" y="445" font-size="15" fill="#212121" font-family="Arial">Ngày hiệu lực hợp đồng *</text>
  <g>
    <rect x="260" y="425" width="160" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="268" y="450" font-size="14" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
    <rect x="402" y="433" width="12" height="12" fill="#1976D2" rx="2" />
    <text x="260" y="470" font-size="12" fill="#E53935" font-family="Arial">* Vui lòng chọn ngày hiệu lực</text>
  </g>

  <!-- 5. Thời gian thực hiện (tháng) -->
  <text x="440" y="445" font-size="15" fill="#212121" font-family="Arial">Thời gian thực hiện (tháng) *</text>
  <g>
    <rect x="680" y="425" width="120" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="688" y="450" font-size="14" fill="#757575" font-family="Arial">VD: 36</text>
  </g>

  <!-- 6. Ngày hết hiệu lực (auto) -->
  <text x="60" y="495" font-size="15" fill="#212121" font-family="Arial">Ngày hết hiệu lực (tự động)</text>
  <g>
    <rect x="260" y="475" width="160" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
    <text x="268" y="500" font-size="14" fill="#9E9E9E" font-family="Arial">dd/mm/yyyy</text>
    <text x="430" y="495" font-size="12" fill="#9E9E9E" font-family="Arial">= Ngày hiệu lực + Thời gian thực hiện</text>
  </g>

  <!-- 7. Giá trị hợp đồng + đơn vị tiền tệ -->
  <text x="60" y="545" font-size="15" fill="#212121" font-family="Arial">Giá trị hợp đồng *</text>
  <g>
    <rect x="260" y="525" width="280" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="268" y="550" font-size="14" fill="#757575" font-family="Arial">Nhập số tiền</text>
    <!-- Dropdown đơn vị -->
    <rect x="550" y="525" width="90" height="36" rx="6" fill="#F5F5F5" stroke="#1976D2" stroke-width="2" />
    <text x="560" y="550" font-size="14" fill="#212121" font-family="Arial">VND</text>
    <polygon points="620,540 635,540 627.5,555" fill="#1976D2" />
  </g>

  <!-- 8. Nhà thầu: textbox search + gợi ý (thiếu -> lỗi) -->
  <text x="60" y="595" font-size="15" fill="#212121" font-family="Arial">Nhà thầu *</text>
  <g>
    <!-- Ô search -->
    <rect x="260" y="575" width="380" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <!-- icon kính lúp -->
    <circle cx="278" cy="593" r="7" stroke="#1976D2" fill="none" stroke-width="2" />
    <line x1="283" y1="598" x2="288" y2="603" stroke="#1976D2" stroke-width="2" />
    <text x="300" y="600" font-size="14" fill="#757575" font-family="Arial">Gõ để tìm kiếm nhà thầu...</text>
    <text x="650" y="570" font-size="12" fill="#E53935" font-family="Arial">* Bắt buộc</text>
    <!-- Gợi ý (typeahead) -->
    <rect x="260" y="613" width="380" height="60" rx="6" fill="#FFFFFF" stroke="#1976D2" stroke-width="1" />
    <text x="272" y="633" font-size="14" fill="#212121" font-family="Arial">• Công ty ABC</text>
    <text x="272" y="653" font-size="14" fill="#212121" font-family="Arial">• Tổng công ty Xây dựng XYZ</text>
  </g>

  <!-- 9. Loại hợp đồng (auto) -->
  <text x="60" y="690" font-size="15" fill="#212121" font-family="Arial">Loại hợp đồng</text>
  <rect x="260" y="670" width="200" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="270" y="695" font-size="14" fill="#9E9E9E" font-family="Arial">Tự động từ CSDL</text>

  <!-- 10. Số đợt thanh toán: input số thủ công >=1 (thiếu/không hợp lệ -> lỗi) -->
  <text x="480" y="690" font-size="15" fill="#212121" font-family="Arial">Số đợt thanh toán *</text>
  <g>
    <rect x="680" y="670" width="120" height="36" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
    <text x="688" y="695" font-size="14" fill="#757575" font-family="Arial">Nhập số &gt;= 1</text>
    <text x="680" y="710" font-size="12" fill="#E53935" font-family="Arial">* Giá trị phải là số nguyên &gt;= 1</text>
  </g>

  <!-- Ghi chú nút Lưu bị vô hiệu -->
  <text x="600" y="715" font-size="12" fill="#E53935" font-family="Arial">Nút "Lưu" bị vô hiệu do thiếu dữ liệu bắt buộc</text>

  <!-- Nút hành động (Lưu - disabled) -->
  <rect x="600" y="720" width="110" height="36" rx="8" fill="#BDBDBD" />
  <text x="655" y="743" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Lưu</text>
  <rect x="720" y="720" width="110" height="36" rx="8" fill="#BDBDBD" />
  <text x="775" y="743" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Hủy</text>
</svg>
