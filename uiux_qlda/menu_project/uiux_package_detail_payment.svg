<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Frame giống uiux_package_detail.svg -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (mới) -->
  <rect x="0" y="100" width="220" height="50" fill="#1976D2" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <rect x="0" y="150" width="220" height="50" fill="#1565C0" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <!-- Icon dự án -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <!-- Icon hợp đồng -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <rect x="0" y="250" width="220" height="50" fill="#1976D2" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <!-- Icon nhà thầu -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <!-- Icon kho tri thức -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết gói thầu</text>

  <!-- Info Card -->
  <rect x="250" y="100" width="1620" height="180" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="140" font-size="22" fill="#1976D2" font-family="Arial">Gói thầu: Tên gói thầu</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Lĩnh vực: Mua sắm</text>
  <text x="270" y="210" font-size="16" fill="#212121" font-family="Arial">Giá gói thầu: 2 tỷ VND</text>
  <text x="270" y="240" font-size="16" fill="#212121" font-family="Arial">Thời gian thực hiện: 6 tháng</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Nguồn vốn: Ngân sách nhà nước</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">Hình thức LCNT: Đấu thầu rộng rãi</text>
  <text x="600" y="240" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang đấu thầu</text>
  <text x="1000" y="180" font-size="16" fill="#212121" font-family="Arial">Phương thức LCNT: 1 giai đoạn 2 túi hồ sơ</text>
  <text x="1000" y="210" font-size="16" fill="#212121" font-family="Arial">Loại hợp đồng: Trọn gói</text>
  <text x="1400" y="180" font-size="16" fill="#212121" font-family="Arial">Thời gian TCLCNT: 30 ngày</text>
  <text x="1400" y="210" font-size="16" fill="#212121" font-family="Arial">Thời gian bắt đầu TCLCNT: Quý 1/2025</text>

  <!-- Tabs: Thông tin hợp đồng | Thanh toán (active) | Tài liệu -->
  <g>
    <rect x="250" y="300" width="180" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="340" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Thông tin hợp đồng</text>
    <rect x="430" y="300" width="140" height="40" fill="#1976D2" />
    <text x="500" y="325" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Thanh toán</text>
    <rect x="570" y="300" width="120" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="630" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <rect x="430" y="340" width="140" height="4" fill="#1976D2" />
  </g>

  <!-- Nội dung nhúng: Thanh toán hợp đồng -->
  <text x="260" y="365" font-size="12" fill="#757575" font-family="Arial">Ghi chú: Tổng giá trị các đợt &lt;= Giá trị hợp đồng. Hồ sơ thanh toán là bắt buộc ở mỗi đợt.</text>
  <!-- Toolbar -->
  <g>
    <rect x="250" y="380" width="120" height="32" rx="8" fill="#1976D2" />
    <text x="310" y="401" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">+ Thêm đợt</text>
    <rect x="380" y="380" width="150" height="32" rx="8" fill="#E3F2FD" stroke="#1976D2" />
    <text x="455" y="401" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Sinh theo số đợt</text>
  </g>

  <!-- Header bảng -->
  <rect x="250" y="430" width="1620" height="40" fill="#E3F2FD" />
  <text x="270" y="456" font-size="14" fill="#1976D2" font-family="Arial">Đợt</text>
  <text x="340" y="456" font-size="14" fill="#1976D2" font-family="Arial">Ngày thanh toán *</text>
  <text x="510" y="456" font-size="14" fill="#1976D2" font-family="Arial">Giá trị (VND) *</text>
  <text x="690" y="456" font-size="14" fill="#1976D2" font-family="Arial">Tỷ lệ (%) (tự tính)</text>
  <text x="840" y="456" font-size="14" fill="#1976D2" font-family="Arial">Trạng thái *</text>
  <text x="1010" y="456" font-size="14" fill="#1976D2" font-family="Arial">Số chứng từ *</text>
  <text x="1180" y="456" font-size="14" fill="#1976D2" font-family="Arial">Ghi chú</text>
  <text x="1330" y="456" font-size="14" fill="#1976D2" font-family="Arial">Hồ sơ thanh toán *</text>
  <text x="1540" y="456" font-size="14" fill="#1976D2" font-family="Arial">Hành động</text>

  <!-- Row 1 -->
  <rect x="250" y="470" width="1620" height="56" fill="#fff" stroke="#E0E0E0" />
  <text x="270" y="503" font-size="14" fill="#212121" font-family="Arial">Đợt 1</text>
  <rect x="330" y="482" width="140" height="28" rx="6" fill="#F5F5F5" stroke="#E53935" stroke-width="2" />
  <text x="338" y="501" font-size="12" fill="#9E9E9E" font-family="Arial">dd/mm/yyyy</text>
  <rect x="500" y="482" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#1976D2" />
  <text x="508" y="501" font-size="12" fill="#757575" font-family="Arial">VD: 300.000.000</text>
  <rect x="680" y="482" width="120" height="28" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="688" y="501" font-size="12" fill="#9E9E9E" font-family="Arial">tự tính</text>
  <rect x="830" y="482" width="150" height="28" rx="6" fill="#F5F5F5" stroke="#1976D2" />
  <text x="838" y="501" font-size="12" fill="#212121" font-family="Arial">Chưa thanh toán</text>
  <polygon points="960,492 975,492 967.5,504" fill="#1976D2" />
  <rect x="1000" y="482" width="160" height="28" rx="6" fill="#F5F5F5" stroke="#1976D2" />
  <text x="1008" y="501" font-size="12" fill="#757575" font-family="Arial">Nhập số chứng từ</text>
  <rect x="1170" y="482" width="140" height="28" rx="6" fill="#F5F5F5" stroke="#1976D2" />
  <text x="1178" y="501" font-size="12" fill="#757575" font-family="Arial">Tuỳ chọn</text>
  <rect x="1310" y="482" width="180" height="28" rx="6" fill="#FFF" stroke="#E53935" stroke-width="2" />
  <text x="1318" y="501" font-size="12" fill="#E53935" font-family="Arial">* Chưa đính kèm</text>
  <!-- Nhóm icon hành động -->
  <g id="actions-row1" transform="translate(1500,478)">
    <!-- View icon (eye) -->
    <g cursor="pointer">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#E3F2FD" stroke="#1976D2" />
      <ellipse cx="16" cy="16" rx="10" ry="7" fill="none" stroke="#1976D2" stroke-width="2" />
      <circle cx="16" cy="16" r="3" fill="#1976D2" />
    </g>
    <!-- Edit icon (pencil) -->
    <g cursor="pointer" transform="translate(40,0)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#E8F5E9" stroke="#2E7D32" />
      <path d="M8 22 L8 24 L10 24 L22 12 L20 10 Z" fill="#2E7D32" />
      <path d="M18 8 L20 10" stroke="#2E7D32" stroke-width="2" />
    </g>
    <!-- Delete icon (trash) -->
    <g cursor="pointer" transform="translate(80,0)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#FFEBEE" stroke="#C62828" />
      <rect x="10" y="12" width="12" height="14" fill="none" stroke="#C62828" stroke-width="2" />
      <line x1="8" y1="12" x2="24" y2="12" stroke="#C62828" stroke-width="2" />
      <line x1="14" y1="12" x2="14" y2="8" stroke="#C62828" stroke-width="2" />
      <line x1="18" y1="12" x2="18" y2="8" stroke="#C62828" stroke-width="2" />
      <line x1="14" y1="16" x2="14" y2="22" stroke="#C62828" stroke-width="2" />
      <line x1="18" y1="16" x2="18" y2="22" stroke="#C62828" stroke-width="2" />
    </g>
  </g>

  <!-- Ghi chú quy tắc -->
  <text x="250" y="540" font-size="12" fill="#757575" font-family="Arial">• Tỷ lệ (%) = Giá trị đợt / Giá trị hợp đồng (hệ thống tự tính, không cho nhập)</text>
  <text x="250" y="558" font-size="12" fill="#E53935" font-family="Arial">• Khi chuyển trạng thái sang "Đã thanh toán" → bắt buộc có Ngày thanh toán thực tế, Giá trị thanh toán thực tế, Số chứng từ &amp; Hồ sơ thanh toán</text>
  <text x="250" y="576" font-size="12" fill="#757575" font-family="Arial">• Nếu Trạng thái = "Chưa thanh toán": cột Ngày thanh toán &amp; Giá trị (VND) thể hiện giá trị dự kiến</text>
  <text x="250" y="594" font-size="12" fill="#757575" font-family="Arial">• Nếu Trạng thái = "Đã thanh toán": cột Ngày thanh toán &amp; Giá trị (VND) thể hiện giá trị thực tế (được cập nhật qua form bật lên)</text>
  <text x="250" y="612" font-size="12" fill="#757575" font-family="Arial">• Thao tác đổi Trạng thái từ "Chưa thanh toán" → "Đã thanh toán" sẽ mở form nhập thông tin thực tế để xác nhận</text>
</svg>
