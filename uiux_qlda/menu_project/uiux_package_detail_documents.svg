<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Frame giống uiux_package_detail.svg -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (mới) -->
  <rect x="0" y="100" width="220" height="50" fill="#1976D2" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <rect x="0" y="150" width="220" height="50" fill="#1565C0" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <!-- Icon dự án -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <!-- Icon hợp đồng -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <rect x="0" y="250" width="220" height="50" fill="#1976D2" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <!-- Icon nhà thầu -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <!-- Icon kho tri thức -->
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết gói thầu</text>

  <!-- Info Card -->
  <rect x="250" y="100" width="1620" height="180" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="140" font-size="22" fill="#1976D2" font-family="Arial">Gói thầu: Tên gói thầu</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Lĩnh vực: Mua sắm</text>
  <text x="270" y="210" font-size="16" fill="#212121" font-family="Arial">Giá gói thầu: 2 tỷ VND</text>
  <text x="270" y="240" font-size="16" fill="#212121" font-family="Arial">Thời gian thực hiện: 6 tháng</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Nguồn vốn: Ngân sách nhà nước</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">Hình thức LCNT: Đấu thầu rộng rãi</text>
  <text x="600" y="240" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang đấu thầu</text>
  <text x="1000" y="180" font-size="16" fill="#212121" font-family="Arial">Phương thức LCNT: 1 giai đoạn 2 túi hồ sơ</text>
  <text x="1000" y="210" font-size="16" fill="#212121" font-family="Arial">Loại hợp đồng: Trọn gói</text>
  <text x="1400" y="180" font-size="16" fill="#212121" font-family="Arial">Thời gian TCLCNT: 30 ngày</text>
  <text x="1400" y="210" font-size="16" fill="#212121" font-family="Arial">Thời gian bắt đầu TCLCNT: Quý 1/2025</text>

  <!-- Tabs: Thông tin hợp đồng | Thanh toán | Tài liệu (active) -->
  <g>
    <rect x="250" y="300" width="180" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="340" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Thông tin hợp đồng</text>
    <rect x="430" y="300" width="140" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="500" y="325" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Thanh toán</text>
    <rect x="570" y="300" width="120" height="40" fill="#1976D2" />
    <text x="630" y="325" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <rect x="570" y="340" width="120" height="4" fill="#1976D2" />
  </g>

  <!-- Nội dung nhúng: Tài liệu gói thầu -->
  <text x="250" y="360" font-size="12" fill="#757575" font-family="Arial">Có thể chọn nhiều tài liệu để tải xuống. Dùng checkbox để chọn.</text>

  <!-- Header bảng (căn khung 1620px) -->
  <rect x="250" y="380" width="1620" height="40" fill="#E3F2FD" />
  <rect x="260" y="390" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="406" font-size="14" fill="#1976D2" font-family="Arial">STT</text>
  <text x="360" y="406" font-size="14" fill="#1976D2" font-family="Arial">Loại tài liệu</text>
  <text x="620" y="406" font-size="14" fill="#1976D2" font-family="Arial">Tên tài liệu</text>
  <text x="900" y="406" font-size="14" fill="#1976D2" font-family="Arial">Số tài liệu</text>
  <text x="1080" y="406" font-size="14" fill="#1976D2" font-family="Arial">Ngày ký</text>
  <text x="1240" y="406" font-size="14" fill="#1976D2" font-family="Arial">Ngày upload</text>
  <text x="1400" y="406" font-size="14" fill="#1976D2" font-family="Arial">Người upload</text>
  <text x="1560" y="406" font-size="14" fill="#1976D2" font-family="Arial">Hành động</text>

  <!-- Row 1 -->
  <rect x="250" y="420" width="1620" height="44" fill="#fff" stroke="#E0E0E0" />
  <rect x="260" y="432" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="448" font-size="13" fill="#212121" font-family="Arial">1</text>
  <text x="360" y="448" font-size="13" fill="#212121" font-family="Arial">Hợp đồng</text>
  <text x="620" y="448" font-size="13" fill="#212121" font-family="Arial">Hợp đồng số 01</text>
  <text x="900" y="448" font-size="13" fill="#212121" font-family="Arial">HD-01/2025</text>
  <text x="1080" y="448" font-size="13" fill="#212121" font-family="Arial">01/09/2025</text>
  <text x="1240" y="448" font-size="13" fill="#212121" font-family="Arial">01/09/2025</text>
  <text x="1400" y="448" font-size="13" fill="#212121" font-family="Arial">Nguyễn Văn A</text>
  <text x="1560" y="448" font-size="13" fill="#1976D2" font-family="Arial">Tải | Xem | Upload | Xoá</text>

  <!-- Row 2 (zebra) -->
  <rect x="250" y="464" width="1620" height="44" fill="#FAFAFA" stroke="#E0E0E0" />
  <rect x="260" y="476" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="492" font-size="13" fill="#212121" font-family="Arial">2</text>
  <text x="360" y="492" font-size="13" fill="#212121" font-family="Arial">Biên bản</text>
  <text x="620" y="492" font-size="13" fill="#212121" font-family="Arial">Biên bản nghiệm thu</text>
  <text x="900" y="492" font-size="13" fill="#212121" font-family="Arial">BBNT-02/2025</text>
  <text x="1080" y="492" font-size="13" fill="#212121" font-family="Arial">10/09/2025</text>
  <text x="1240" y="492" font-size="13" fill="#212121" font-family="Arial">10/09/2025</text>
  <text x="1400" y="492" font-size="13" fill="#212121" font-family="Arial">Trần Thị B</text>
  <text x="1560" y="492" font-size="13" fill="#1976D2" font-family="Arial">Tải | Xem | Upload | Xoá</text>

  <!-- Buttons dưới bảng -->
  <rect x="250" y="530" width="160" height="40" rx="8" fill="#388E3C" />
  <text x="330" y="557" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Tải xuống</text>
  <rect x="420" y="530" width="160" height="40" rx="8" fill="#388E3C" />
  <text x="500" y="557" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Huỷ chọn</text>
</svg>
