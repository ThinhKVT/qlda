<svg width="1200" height="760" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- POPUP: SỬA BẢN GHI QUYẾT TOÁN -->
  <rect x="40" y="30" width="1120" height="700" rx="20" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" />
  <text x="600" y="70" font-size="22" fill="#1976D2" font-family="Arial" text-anchor="middle">Sửa bản ghi quyết toán</text>
  <g cursor="pointer">
    <rect x="1070" y="48" width="60" height="28" rx="8" fill="#BDBDBD" />
    <text x="1100" y="67" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle">Đóng</text>
  </g>

  <!-- Thông tin dự án tóm tắt -->
  <rect x="70" y="95" width="1060" height="86" rx="12" fill="#FAFAFA" stroke="#E0E0E0" />
  <text x="90" y="125" font-size="13" fill="#757575" font-family="Arial">Dự án</text>
  <text x="180" y="125" font-size="14" fill="#212121" font-family="Arial">Dự án A - Triển khai phần mềm</text>
  <text x="90" y="150" font-size="13" fill="#757575" font-family="Arial">Loại dự án</text>
  <text x="180" y="150" font-size="14" fill="#212121" font-family="Arial">Dự án</text>
  <text x="520" y="125" font-size="13" fill="#757575" font-family="Arial">Trạng thái hiện tại</text>
  <rect x="660" y="110" width="140" height="24" rx="12" fill="#E8F5E9" stroke="#388E3C" />
  <text x="730" y="127" font-size="12" fill="#388E3C" font-family="Arial" text-anchor="middle">Đã quyết toán</text>

  <!-- Form chỉnh sửa -->
  <!-- Hàng 1: Giá trị, Ngày -->
  <text x="70" y="210" font-size="13" fill="#757575" font-family="Arial">Giá trị quyết toán (VND)</text>
  <rect x="70" y="218" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#BDBDBD" />
  <text x="85" y="244" font-size="14" fill="#9E9E9E" font-family="Arial">1.750.000.000</text>

  <text x="410" y="210" font-size="13" fill="#757575" font-family="Arial">Ngày quyết toán</text>
  <rect x="410" y="218" width="210" height="40" rx="8" fill="#FFFFFF" stroke="#BDBDBD" />
  <text x="425" y="244" font-size="14" fill="#9E9E9E" font-family="Arial">01/09/2025</text>

  <!-- Hàng 2: Trạng thái, Ghi chú -->
  <text x="70" y="280" font-size="13" fill="#757575" font-family="Arial">Trạng thái</text>
  <rect x="70" y="288" width="210" height="40" rx="8" fill="#FFFFFF" stroke="#BDBDBD" />
  <text x="85" y="314" font-size="14" fill="#9E9E9E" font-family="Arial">Đã quyết toán ▾</text>

  <text x="300" y="280" font-size="13" fill="#757575" font-family="Arial">Ghi chú</text>
  <rect x="300" y="288" width="830" height="100" rx="10" fill="#FFFFFF" stroke="#BDBDBD" />
  <text x="315" y="314" font-size="14" fill="#9E9E9E" font-family="Arial">Quyết toán theo BBNT-01...</text>

  <!-- Hàng 3: Trạng thái hồ sơ (badge TT/TĐ/QĐ) -->
  <text x="70" y="420" font-size="13" fill="#757575" font-family="Arial">Tình trạng hồ sơ</text>
  <!-- TT: done -->
  <g>
    <rect x="70" y="430" width="66" height="24" rx="12" fill="#E8F5E9" stroke="#388E3C" />
    <text x="85" y="447" font-size="12" fill="#388E3C" font-family="Arial">TT ✓</text>
  </g>
  <!-- TĐ: fail -->
  <g>
    <rect x="145" y="430" width="66" height="24" rx="12" fill="#FFEBEE" stroke="#D32F2F" />
    <text x="160" y="447" font-size="12" fill="#D32F2F" font-family="Arial">TĐ ×</text>
  </g>
  <!-- QĐ: done -->
  <g>
    <rect x="220" y="430" width="66" height="24" rx="12" fill="#E8F5E9" stroke="#388E3C" />
    <text x="235" y="447" font-size="12" fill="#388E3C" font-family="Arial">QĐ ✓</text>
  </g>
  <text x="300" y="447" font-size="12" fill="#9E9E9E" font-family="Arial">(TT: Tờ trình, TĐ: Thẩm định, QĐ: Quyết định)</text>

  <!-- Gợi ý: có thể mở popup Upload để cập nhật hồ sơ -->
  <g cursor="pointer">
    <rect x="70" y="470" width="160" height="32" rx="8" fill="#1976D2" />
    <text x="150" y="491" font-size="13" fill="#fff" font-family="Arial" text-anchor="middle">Mở popup Upload</text>
  </g>

  <!-- Ghi chú đồng bộ -->
  <text x="70" y="515" font-size="12" fill="#757575" font-family="Arial">Các tệp hồ sơ cập nhật tại đây sẽ đồng bộ sang tab "Tài liệu" của dự án.</text>

  <!-- Nút hành động -->
  <rect x="900" y="660" width="110" height="40" rx="10" fill="#1976D2" />
  <text x="955" y="686" font-size="13" fill="#fff" font-family="Arial" text-anchor="middle">Lưu</text>
  <rect x="780" y="660" width="110" height="40" rx="10" fill="#BDBDBD" />
  <text x="835" y="686" font-size="13" fill="#fff" font-family="Arial" text-anchor="middle">Huỷ</text>

  <!-- COMMENT: Popup này mở khi bấm "Sửa" trong cột Hành động của bảng Quyết toán. -->
</svg>

