<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Sidebar (đồng bộ với project_detail) -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <rect x="0" y="100" width="220" height="50" fill="#1565C0" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <rect x="0" y="150" width="220" height="50" fill="#1976D2" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Gói thầu</text>
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <!-- Topbar (same as project detail) -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <!-- Back button (đồng bộ với project_detail) -->
  <g id="back-button" cursor="pointer">
    <rect x="230" y="18" width="32" height="32" rx="8" fill="#1976D2" />
    <polygon points="250,34 262,22 262,46" fill="#fff" />
    <text x="270" y="40" font-size="18" fill="#fff" font-family="Arial">Back</text>
  </g>
  <text x="340" y="40" font-size="24" fill="#fff" font-family="Arial">Chi tiết dự án</text>
  <!-- Notification & Setting buttons (topbar, right side) -->
  <g id="notification-button" cursor="pointer">
    <circle cx="1800" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <path d="M1792 36 Q1800 20 1808 36" stroke="#1976D2" stroke-width="2" fill="none" />
    <circle cx="1800" cy="38" r="3" fill="#1976D2" />
  </g>
  <g id="setting-button" cursor="pointer">
    <circle cx="1850" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <circle cx="1850" cy="32" r="7" fill="none" stroke="#1976D2" stroke-width="2" />
    <rect x="1847" y="25" width="6" height="14" rx="2" fill="#1976D2" />
  </g>
  <!-- Project Info Card (synchronized) -->
  <rect x="250" y="120" width="1620" height="120" rx="12" fill="#fff" stroke="#BDBDBD" />
  <text x="270" y="150" font-size="20" fill="#1976D2" font-family="Arial">Dự án A</text>
  <text x="270" y="180" font-size="16" fill="#212121" font-family="Arial">Kinh phí đầu tư: 2 tỷ VND</text>
  <text x="600" y="180" font-size="16" fill="#212121" font-family="Arial">Tổng giá trị hợp đồng: 1.8 tỷ VND</text>
  <text x="950" y="180" font-size="16" fill="#212121" font-family="Arial">Loại kế hoạch: Mới</text>
  <text x="270" y="210" font-size="16" fill="#388E3C" font-family="Arial">Trạng thái: Đang thực hiện</text>
  <text x="600" y="210" font-size="16" fill="#212121" font-family="Arial">01/01/2025 - 31/12/2025</text>
  <text x="950" y="210" font-size="16" fill="#212121" font-family="Arial">Năm kế hoạch: 2025</text>
  <!-- Tabs -->
  <g>
    <rect x="250" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="325" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Tiến độ</text>
    <rect x="400" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="475" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Gói thầu</text>
    <rect x="550" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="625" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhân sự</text>
    <rect x="700" y="290" width="150" height="40" fill="#1976D2" />
    <text x="775" y="315" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Tài liệu</text>
    <rect x="850" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="925" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Quyết toán</text>
    <rect x="1000" y="290" width="150" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" />
    <text x="1075" y="315" font-size="16" fill="#1976D2" font-family="Arial" text-anchor="middle">Nhật ký</text>
    <rect x="700" y="330" width="150" height="4" fill="#1976D2" />
  </g>
  <!-- Section: Tài liệu đính kèm (đồng bộ header với package_detail) -->
  <!-- Checkbox chọn tất cả ở đầu bảng -->
  <rect x="250" y="350" width="40" height="40" fill="#E3F2FD" />
  <rect x="260" y="360" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <!-- Icon tick chỉ là minh họa, thực tế sẽ là trạng thái checked/unchecked -->
  <!-- Header các cột, căn chỉnh sang phải 40px -->
  <text x="300" y="375" font-size="16" fill="#1976D2" font-family="Arial">STT</text>
  <text x="350" y="375" font-size="16" fill="#1976D2" font-family="Arial">Loại tài liệu</text>
  <text x="730" y="375" font-size="16" fill="#1976D2" font-family="Arial">Tên tài liệu</text>
  <text x="930" y="375" font-size="16" fill="#1976D2" font-family="Arial">Số tài liệu</text>
  <text x="1130" y="375" font-size="16" fill="#1976D2" font-family="Arial">Ngày ký</text>
  <text x="1350" y="375" font-size="16" fill="#1976D2" font-family="Arial">Ngày upload</text>
  <text x="1500" y="375" font-size="16" fill="#1976D2" font-family="Arial">Người upload</text>
  <text x="1650" y="375" font-size="16" fill="#1976D2" font-family="Arial">Hành động</text>
  <!-- Example document rows (thêm checkbox chọn từng dòng, căn chỉnh các cột sang phải 40px) -->
  <rect x="250" y="390" width="40" height="40" fill="#fff" />
  <rect x="260" y="400" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="420" font-size="15" fill="#212121" font-family="Arial">1</text>
  <text x="350" y="420" font-size="15" fill="#212121" font-family="Arial">Hợp đồng</text>
  <text x="730" y="420" font-size="15" fill="#212121" font-family="Arial">Hợp đồng số 01</text>
  <text x="930" y="420" font-size="15" fill="#212121" font-family="Arial">HD-01/2025</text>
  <text x="1130" y="420" font-size="15" fill="#212121" font-family="Arial">01/09/2025</text>
  <text x="1350" y="420" font-size="15" fill="#212121" font-family="Arial">01/09/2025</text>
  <text x="1500" y="420" font-size="15" fill="#212121" font-family="Arial">Nguyễn Văn A</text>
  <text x="1650" y="420" font-size="15" fill="#1976D2" font-family="Arial">Tải | Xem | Upload | Xoá</text>
  <rect x="250" y="438" width="40" height="40" fill="#FAFAFA" />
  <rect x="260" y="448" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="300" y="468" font-size="15" fill="#212121" font-family="Arial">2</text>
  <text x="350" y="468" font-size="15" fill="#212121" font-family="Arial">Biên bản</text>
  <text x="730" y="468" font-size="15" fill="#212121" font-family="Arial">Biên bản nghiệm thu</text>
  <text x="930" y="468" font-size="15" fill="#212121" font-family="Arial">BBNT-02/2025</text>
  <text x="1130" y="468" font-size="15" fill="#212121" font-family="Arial">10/09/2025</text>
  <text x="1350" y="468" font-size="15" fill="#212121" font-family="Arial">10/09/2025</text>
  <text x="1500" y="468" font-size="15" fill="#212121" font-family="Arial">Trần Thị B</text>
  <text x="1650" y="468" font-size="15" fill="#1976D2" font-family="Arial">Tải | Xem | Upload | Xoá</text>
  <!-- Button Tải xuống dưới cùng, căn trái với bản ghi -->
  <rect x="250" y="510" width="160" height="40" rx="8" fill="#388E3C" />
  <text x="330" y="537" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Tải xuống</text>
  <!-- Button Huỷ chọn bên phải Tải xuống, cùng màu nền xanh lá -->
  <rect x="420" y="510" width="160" height="40" rx="8" fill="#388E3C" />
  <text x="500" y="537" font-size="18" fill="#fff" font-family="Arial" text-anchor="middle">Huỷ chọn</text>
</svg>
