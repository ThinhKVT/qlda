<svg width="1200" height="640" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- Tab: Thông tin hợp đồng (package_detail) - dữ liệu readonly, đồng bộ tự động từ form Ký hợp đồng -->
  <rect x="40" y="30" width="1120" height="580" rx="16" fill="#fff" stroke="#1976D2" stroke-width="2" />
  <text x="600" y="65" font-size="22" fill="#1976D2" font-family="Arial" text-anchor="middle">Thông tin hợp đồng</text>
  <text x="1060" y="65" font-size="12" fill="#757575" font-family="Arial" text-anchor="end">Đồng bộ từ "Ký hợp đồng"</text>

  <!-- Hàng 1: Tên hợp đồng (full width) -->
  <text x="70" y="110" font-size="15" fill="#212121" font-family="Arial">Tên hợp đồng</text>
  <rect x="240" y="90" width="880" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="115" font-size="14" fill="#212121" font-family="Arial">Tên gói thầu</text>

  <!-- Hàng 2: Số HĐ, Ngày ký, Loại HĐ -->
  <text x="70" y="160" font-size="15" fill="#212121" font-family="Arial">Số hợp đồng</text>
  <rect x="240" y="140" width="240" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="165" font-size="14" fill="#212121" font-family="Arial">HD-2025/001</text>

  <text x="510" y="160" font-size="15" fill="#212121" font-family="Arial">Ngày ký</text>
  <rect x="600" y="140" width="160" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="610" y="165" font-size="14" fill="#212121" font-family="Arial">23/05/2025</text>

  <text x="800" y="160" font-size="15" fill="#212121" font-family="Arial">Loại hợp đồng</text>
  <rect x="930" y="140" width="190" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="940" y="165" font-size="14" fill="#212121" font-family="Arial">Trọn gói</text>

  <!-- Hàng 3: Ngày hiệu lực, Thời gian (tháng), Ngày hết hiệu lực -->
  <text x="70" y="210" font-size="15" fill="#212121" font-family="Arial">Ngày hiệu lực</text>
  <rect x="240" y="190" width="160" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="215" font-size="14" fill="#212121" font-family="Arial">23/05/2025</text>

  <text x="430" y="210" font-size="15" fill="#212121" font-family="Arial">Thời gian (tháng)</text>
  <rect x="580" y="190" width="120" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="590" y="215" font-size="14" fill="#212121" font-family="Arial">36</text>

  <text x="740" y="210" font-size="15" fill="#212121" font-family="Arial">Ngày hết hiệu lực</text>
  <rect x="910" y="190" width="210" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="920" y="215" font-size="14" fill="#212121" font-family="Arial">23/05/2028</text>

  <!-- Hàng 4: Giá trị hợp đồng + đơn vị -->
  <text x="70" y="260" font-size="15" fill="#212121" font-family="Arial">Giá trị hợp đồng</text>
  <rect x="240" y="240" width="280" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="265" font-size="14" fill="#212121" font-family="Arial">1.800.000.000</text>
  <rect x="530" y="240" width="90" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="540" y="265" font-size="14" fill="#212121" font-family="Arial">VND</text>

  <!-- Hàng 5: Nhà thầu -->
  <text x="70" y="310" font-size="15" fill="#212121" font-family="Arial">Nhà thầu</text>
  <rect x="240" y="290" width="860" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="315" font-size="14" fill="#212121" font-family="Arial">Tổng công ty Xây dựng XYZ</text>

  <!-- Hàng 6: Số đợt thanh toán -->
  <text x="70" y="360" font-size="15" fill="#212121" font-family="Arial">Số đợt thanh toán</text>
  <rect x="240" y="340" width="120" height="36" rx="6" fill="#EEEEEE" stroke="#BDBDBD" />
  <text x="250" y="365" font-size="14" fill="#212121" font-family="Arial">6</text>

  <!-- Divider -->
  <line x1="60" y1="390" x2="1140" y2="390" stroke="#E0E0E0" />
  <text x="70" y="415" font-size="13" fill="#757575" font-family="Arial">Ghi chú: Các thông tin này được đồng bộ tự động sau khi lưu form "Ký hợp đồng".</text>

  <!-- Nút hành động (chỉ giữ nút Đóng, bỏ Làm mới) -->
  <rect x="1060" y="550" width="100" height="36" rx="8" fill="#BDBDBD" />
  <text x="1110" y="573" font-size="16" fill="#fff" font-family="Arial" text-anchor="middle">Đóng</text>
</svg>
