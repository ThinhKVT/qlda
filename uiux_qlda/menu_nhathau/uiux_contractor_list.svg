<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- MÀN HÌNH: QUẢN LÝ NHÀ THẦU -->
  <!-- Sidebar đồng bộ -->
  <rect x="0" y="0" width="220" height="1080" fill="#1976D2" />
  <text x="30" y="60" font-size="24" fill="#fff" font-family="Arial">Menu</text>
  <!-- Dashboard (mới) -->
  <rect x="0" y="100" width="220" height="50" fill="#1976D2" />
  <text x="30" y="130" font-size="18" fill="#fff" font-family="Arial">Dashboard</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,112)">
    <rect x="0" y="0" width="8" height="8" rx="1" />
    <rect x="10" y="0" width="8" height="8" rx="1" />
    <rect x="0" y="10" width="8" height="8" rx="1" />
    <rect x="10" y="10" width="8" height="8" rx="1" />
  </g>
  <!-- Dự án -->
  <rect x="0" y="150" width="220" height="50" fill="#1976D2" />
  <text x="30" y="180" font-size="18" fill="#fff" font-family="Arial">Dự án</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,162)">
    <rect x="0" y="8" width="18" height="12" rx="2" />
    <rect x="0" y="0" width="10" height="6" rx="1" />
  </g>
  <!-- Hợp đồng -->
  <rect x="0" y="200" width="220" height="50" fill="#1976D2" />
  <text x="30" y="230" font-size="18" fill="#fff" font-family="Arial">Hợp đồng</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,212)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="4" y1="4" x2="14" y2="4" />
    <line x1="4" y1="8" x2="14" y2="8" />
    <line x1="4" y1="12" x2="10" y2="12" />
  </g>
  <!-- Nhà thầu (active) dời xuống -->
  <rect x="0" y="250" width="220" height="50" fill="#1565C0" />
  <text x="30" y="280" font-size="18" fill="#fff" font-family="Arial">Nhà thầu</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,262)">
    <circle cx="6" cy="6" r="5" />
    <circle cx="14" cy="10" r="4" />
    <path d="M1 16 q5-4 10 0" />
  </g>
  <!-- Kho tri thức dời xuống -->
  <rect x="0" y="300" width="220" height="50" fill="#1976D2" />
  <text x="30" y="330" font-size="18" fill="#fff" font-family="Arial">Kho tri thức</text>
  <g stroke="#fff" stroke-width="2" fill="none" transform="translate(8,312)">
    <rect x="0" y="0" width="18" height="16" rx="2" />
    <line x1="6" y1="0" x2="6" y2="16" />
  </g>
  <!-- Topbar -->
  <rect x="220" y="0" width="1700" height="64" fill="#2196F3" />
  <text x="250" y="40" font-size="24" fill="#fff" font-family="Arial">Quản lý nhà thầu</text>
  <g id="notification-button">
    <circle cx="1800" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <path d="M1792 36 Q1800 20 1808 36" stroke="#1976D2" stroke-width="2" fill="none" />
    <circle cx="1800" cy="38" r="3" fill="#1976D2" />
  </g>
  <g id="setting-button">
    <circle cx="1850" cy="32" r="18" fill="#fff" stroke="#1976D2" stroke-width="2" />
    <circle cx="1850" cy="32" r="7" fill="none" stroke="#1976D2" stroke-width="2" />
    <rect x="1847" y="25" width="6" height="14" rx="2" fill="#1976D2" />
  </g>
  <!-- Ghi chú nghiệp vụ -->
  <text x="250" y="80" font-size="12" fill="#757575" font-family="Arial">* Thông tin hợp đồng đồng bộ tự động từ menu Dự án. Không nhập lại thủ công.</text>
  <!-- Bộ lọc rút gọn sửa -->
  <g id="contractor-filters-slim">
    <rect x="250" y="95" width="480" height="36" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
    <text x="262" y="118" font-size="14" fill="#757575" font-family="Arial">Tìm theo tên / viết tắt nhà thầu</text>
    <rect x="740" y="95" width="120" height="36" rx="8" fill="#1976D2" />
    <text x="800" y="118" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Tìm</text>
    <rect x="870" y="95" width="120" height="36" rx="8" fill="#BDBDBD" />
    <text x="930" y="118" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">Clear</text>
    <rect x="1000" y="95" width="150" height="36" rx="8" fill="#E3F2FD" stroke="#1976D2" />
    <text x="1075" y="118" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Xuất Excel</text>
  </g>
  <!-- Toolbar cập nhật -->
  <g id="contractor-toolbar" transform="translate(0,-10)">
    <rect x="250" y="140" width="190" height="36" rx="8" fill="#1976D2" />
    <text x="345" y="164" font-size="14" fill="#fff" font-family="Arial" text-anchor="middle">+ Thêm nhà thầu</text>
    <!-- ĐÃ XOÁ Gộp trùng và Đồng bộ HĐ -->
  </g>
  <!-- Header bảng chính (căn lại do bỏ cột Xếp hạng) -->
  <rect x="250" y="190" width="1620" height="40" fill="#E3F2FD" />
  <rect x="260" y="200" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" />
  <text x="300" y="216" font-size="14" fill="#1976D2" font-family="Arial">STT</text>
  <text x="340" y="216" font-size="14" fill="#1976D2" font-family="Arial">Tên đầy đủ</text>
  <text x="620" y="216" font-size="14" fill="#1976D2" font-family="Arial">Tên viết tắt</text>
  <text x="760" y="216" font-size="14" fill="#1976D2" font-family="Arial">HĐ đang thực hiện</text>
  <text x="1030" y="216" font-size="14" fill="#1976D2" font-family="Arial">HĐ đã hoàn thành</text>
  <text x="1250" y="216" font-size="14" fill="#1976D2" font-family="Arial">Giá trị đang thực hiện</text>
  <text x="1450" y="216" font-size="14" fill="#1976D2" font-family="Arial">Tổng giá trị đã ký</text>
  <text x="1700" y="216" font-size="14" fill="#1976D2" font-family="Arial">Hành động</text>
  <!-- Row 1 cập nhật -->
  <rect x="250" y="230" width="1620" height="48" fill="#fff" stroke="#E0E0E0" />
  <rect x="260" y="242" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" />
  <text x="300" y="260" font-size="13" fill="#212121" font-family="Arial">1</text>
  <text x="340" y="260" font-size="13" fill="#212121" font-family="Arial">Công ty Cổ phần Công nghệ XYZ</text>
  <text x="620" y="260" font-size="13" fill="#212121" font-family="Arial">XYZ</text>
  <text x="760" y="260" font-size="13" fill="#212121" font-family="Arial">3</text>
  <text x="1030" y="260" font-size="13" fill="#212121" font-family="Arial">5</text>
  <text x="1250" y="260" font-size="13" fill="#212121" font-family="Arial">120.000.000.000</text>
  <text x="1450" y="260" font-size="13" fill="#212121" font-family="Arial">540.000.000.000</text>
  <text x="1700" y="260" font-size="13" fill="#1976D2" font-family="Arial">Xem | Sửa | Liên hệ</text>
  <!-- Row 2 cập nhật -->
  <rect x="250" y="278" width="1620" height="48" fill="#FAFAFA" stroke="#E0E0E0" />
  <rect x="260" y="290" width="20" height="20" rx="4" fill="#fff" stroke="#1976D2" />
  <text x="300" y="308" font-size="13" fill="#212121" font-family="Arial">2</text>
  <text x="340" y="308" font-size="13" fill="#212121" font-family="Arial">Tổng Công ty Xây dựng ABC</text>
  <text x="620" y="308" font-size="13" fill="#212121" font-family="Arial">ABC</text>
  <text x="760" y="308" font-size="13" fill="#212121" font-family="Arial">1</text>
  <text x="1030" y="308" font-size="13" fill="#212121" font-family="Arial">12</text>
  <text x="1250" y="308" font-size="13" fill="#212121" font-family="Arial">30.000.000.000</text>
  <text x="1450" y="308" font-size="13" fill="#212121" font-family="Arial">800.000.000.000</text>
  <text x="1700" y="308" font-size="13" fill="#1976D2" font-family="Arial">Xem | Sửa | Liên hệ</text>
  <!-- Khối mở rộng (giữ nguyên cấu trúc, dịch xuống vì header giữ nguyên) -->
  <!-- ...existing code (contractor-detail-expand nếu cần) ... -->
  <!-- Thống kê nhanh (giữ nguyên) -->
  <rect x="250" y="330" width="500" height="90" rx="12" fill="#E3F2FD" stroke="#1976D2" />
  <text x="270" y="355" font-size="14" fill="#1976D2" font-family="Arial">THỐNG KÊ NHÀ THẦU</text>
  <text x="270" y="375" font-size="12" fill="#212121" font-family="Arial">Tổng số nhà thầu: 152</text>
  <text x="430" y="375" font-size="12" fill="#212121" font-family="Arial">Đang có HĐ: 68</text>
  <text x="270" y="395" font-size="12" fill="#212121" font-family="Arial">Tổng giá trị đã ký: 12.560 tỷ</text>
  <text x="270" y="415" font-size="12" fill="#212121" font-family="Arial">Tỷ lệ hoàn thành đúng hạn: 87%</text>
  <!-- XÓA popup tìm kiếm nâng cao & cột xếp hạng -->
  <!-- COMMENT: GỢI Ý CHỨC NĂNG (cập nhật sau khi bỏ xếp hạng hiển thị) -->
  <!--
    GỢI Ý MỞ RỘNG:
    - Dashboard biểu đồ phân bổ giá trị theo nhà thầu lớn.
    - Cảnh báo nhà thầu có tỷ lệ trễ cao hoặc giá trị dở dang lớn.
    - Gợi ý nhà thầu phù hợp khi tạo gói thầu (matching theo lĩnh vực / lịch sử).
    - Lịch sử chỉnh sửa hồ sơ (audit trail) & tải hồ sơ năng lực.
  -->
</svg>
