<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
  <!-- FORM: THÊM TÀI LIỆU KHO TRI THỨC -->
  <rect x="40" y="30" width="1120" height="840" rx="20" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" />
  <text x="600" y="70" font-size="24" fill="#1976D2" font-family="Arial" text-anchor="middle">Thêm tài liệu</text>
  <text x="1080" y="70" font-size="11" fill="#757575" font-family="Arial" text-anchor="end">* Trường bắt buộc</text>
  <!-- CỘT TRÁI -->
  <text x="70" y="110" font-size="14" fill="#212121" font-family="Arial">Tên tài liệu *</text>
  <rect x="70" y="120" width="480" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="82" y="144" font-size="13" fill="#757575" font-family="Arial">Ví dụ: Quy trình nghiệm thu phần mềm</text>

  <text x="70" y="180" font-size="14" fill="#212121" font-family="Arial">Loại tài liệu *</text>
  <rect x="70" y="190" width="220" height="38" rx="8" fill="#F5F5F5" stroke="#1976D2" />
  <text x="82" y="214" font-size="13" fill="#1976D2" font-family="Arial">Chọn: Quy trình...</text>
  <polygon points="270,204 278,204 274,212" fill="#1976D2" />
  <text x="310" y="180" font-size="14" fill="#212121" font-family="Arial">Số / Ký hiệu</text>
  <rect x="310" y="190" width="240" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="322" y="214" font-size="13" fill="#757575" font-family="Arial">VD: QTNTPM-01</text>

  <text x="70" y="250" font-size="14" fill="#212121" font-family="Arial">Ngày ban hành *</text>
  <rect x="70" y="260" width="160" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="82" y="284" font-size="13" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
  <text x="250" y="250" font-size="14" fill="#212121" font-family="Arial">Ngày hiệu lực *</text>
  <rect x="250" y="260" width="160" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="262" y="284" font-size="13" fill="#757575" font-family="Arial">dd/mm/yyyy</text>
  <text x="430" y="250" font-size="14" fill="#212121" font-family="Arial">Ngày hết HL</text>
  <rect x="430" y="260" width="160" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="442" y="284" font-size="13" fill="#757575" font-family="Arial">dd/mm/yyyy</text>

  <text x="70" y="320" font-size="14" fill="#212121" font-family="Arial">Trạng thái *</text>
  <rect x="70" y="330" width="220" height="38" rx="8" fill="#F5F5F5" stroke="#1976D2" />
  <text x="82" y="354" font-size="13" fill="#1976D2" font-family="Arial">Còn hiệu lực</text>
  <polygon points="270,344 278,344 274,352" fill="#1976D2" />
  <text x="310" y="320" font-size="14" fill="#212121" font-family="Arial">Phiên bản *</text>
  <rect x="310" y="330" width="120" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="320" y="354" font-size="13" fill="#757575" font-family="Arial">v1.0</text>

  <text x="70" y="390" font-size="14" fill="#212121" font-family="Arial">Tag</text>
  <rect x="70" y="400" width="480" height="38" rx="8" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="82" y="424" font-size="13" fill="#757575" font-family="Arial">#QuyTrinh, #MuaSam ... (phân tách bằng dấu phẩy)</text>

  <text x="70" y="460" font-size="14" fill="#212121" font-family="Arial">Mô tả / Ghi chú hiển thị</text>
  <rect x="70" y="470" width="480" height="130" rx="12" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="82" y="492" font-size="13" fill="#757575" font-family="Arial">Tóm tắt ngắn, mục đích, phạm vi áp dụng...</text>

  <text x="70" y="630" font-size="14" fill="#212121" font-family="Arial">Ghi chú nội bộ (không hiển thị người dùng cuối)</text>
  <rect x="70" y="640" width="480" height="100" rx="12" fill="#F5F5F5" stroke="#BDBDBD" />

  <!-- CỘT PHẢI: Tải tệp, kiểm soát & lịch sử -->
  <text x="580" y="110" font-size="14" fill="#212121" font-family="Arial">Tệp đính kèm *</text>
  <rect x="580" y="120" width="520" height="160" rx="12" fill="#FAFAFA" stroke="#1976D2" stroke-dasharray="6 6" />
  <text x="840" y="180" font-size="14" fill="#1976D2" font-family="Arial" text-anchor="middle">Kéo và thả hoặc Bấm để chọn tệp (PDF, DOCX, XLSX...)</text>
  <text x="580" y="300" font-size="13" fill="#757575" font-family="Arial">Danh sách tệp đã chọn:</text>
  <rect x="580" y="310" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#E0E0E0" />
  <text x="590" y="335" font-size="12" fill="#212121" font-family="Arial">1. QTNTPM-01.pdf (450 KB)</text>
  <text x="590" y="355" font-size="12" fill="#212121" font-family="Arial">2. QTNTPM-01.docx (120 KB)</text>

  <text x="580" y="390" font-size="14" fill="#212121" font-family="Arial">Tuỳ chọn kiểm soát</text>
  <rect x="580" y="400" width="16" height="16" rx="3" fill="#fff" stroke="#1976D2" />
  <text x="602" y="413" font-size="12" fill="#212121" font-family="Arial">Yêu cầu phê duyệt trước khi xuất bản</text>
  <rect x="580" y="425" width="16" height="16" rx="3" fill="#1976D2" />
  <text x="602" y="438" font-size="12" fill="#212121" font-family="Arial">Cho phép tải xuống</text>
  <rect x="580" y="450" width="16" height="16" rx="3" fill="#1976D2" />
  <text x="602" y="463" font-size="12" fill="#212121" font-family="Arial">Hiển thị trong tìm kiếm công khai</text>

  <text x="580" y="500" font-size="14" fill="#212121" font-family="Arial">Thông tin mở rộng</text>
  <text x="580" y="520" font-size="12" fill="#757575" font-family="Arial">(Có thể dùng cho metadata bổ sung: phòng ban ban hành, người soạn thảo, phê duyệt...)</text>
  <rect x="580" y="535" width="520" height="80" rx="12" fill="#F5F5F5" stroke="#BDBDBD" />
  <text x="590" y="560" font-size="12" fill="#757575" font-family="Arial">Ví dụ: Ban hành bởi Khối CNTT; Phê duyệt bởi ...; Áp dụng cho ...</text>

  <text x="580" y="635" font-size="14" fill="#212121" font-family="Arial">Lịch sử khởi tạo</text>
  <rect x="580" y="645" width="520" height="48" rx="8" fill="#FFFFFF" stroke="#E0E0E0" />
  <text x="590" y="670" font-size="12" fill="#212121" font-family="Arial">Người tạo: thinhnv8 (25/09/2025 14:32) | Phiên bản khởi tạo: v1.0</text>

  <!-- ACTION BUTTONS -->
  <rect x="760" y="770" width="140" height="44" rx="10" fill="#1976D2" />
  <text x="830" y="798" font-size="15" fill="#fff" font-family="Arial" text-anchor="middle">Lưu</text>
  <rect x="910" y="770" width="200" height="44" rx="10" fill="#43A047" />
  <text x="1010" y="798" font-size="15" fill="#fff" font-family="Arial" text-anchor="middle">Lưu và Thêm tiếp</text>
  <rect x="1120" y="770" width="80" height="44" rx="10" fill="#BDBDBD" />
  <text x="1160" y="798" font-size="15" fill="#fff" font-family="Arial" text-anchor="middle">Huỷ</text>

  <!-- FOOTER NOTE -->
  <text x="600" y="830" font-size="11" fill="#757575" font-family="Arial" text-anchor="middle">* Trường có dấu * là bắt buộc. Các thay đổi sẽ ghi nhận phiên bản mới.</text>

  <!-- COMMENT: Dropdown Loại tài liệu = Quy trình, Biểu mẫu, Hướng dẫn, Phân cấp uỷ quyền, Luật, Nghị định, Thông tư; Trạng thái = Còn hiệu lực / Hết hiệu lực -->
</svg>
